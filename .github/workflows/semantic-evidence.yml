name: Legacy pre-v0.13 Semantic Living Wiki evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run deterministic checks or package unanimous independent machine reviews.
        required: true
        type: choice
        options:
          - deterministic_review
          - package_consensus
        default: deterministic_review
      release_ref:
        description: Exact commit to evaluate.
        required: true
        type: string
      evidence_ref:
        description: Ref containing sanitized post-candidate machine-review evidence.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  deterministic-review:
    name: Deterministic Semantic Gold review evidence
    if: ${{ github.event_name == 'pull_request' || inputs.mode == 'deterministic_review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEMANTIC_RELEASE_REF: ${{ github.event.pull_request.head.sha || inputs.release_ref }}

    steps:
      - name: Check out the exact clean candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SEMANTIC_RELEASE_REF }}

      - name: Install uv and Node.js
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Reject v0.13 and later candidates
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tuple(map(int, version.split("."))) >= (0, 13, 0):
              raise SystemExit("v0.13 must use the active qualification and Gate v9 path")
          PY

      - name: Install exact candidate and pinned official host CLIs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${SEMANTIC_RELEASE_REF}^{commit}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          uv sync --frozen --extra dev
          uv build --wheel --out-dir "${RUNNER_TEMP}/dist"
          uv venv --python 3.12 --no-project "${RUNNER_TEMP}/semantic-runtime"
          wheels=("${RUNNER_TEMP}"/dist/deeplaw-*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python "${RUNNER_TEMP}/semantic-runtime/bin/python" "${wheels[0]}"
          npm install --global --prefix "${RUNNER_TEMP}/host-cli" \
            @anthropic-ai/claude-code@2.1.220 \
            opencode-ai@1.18.16
          mkdir -p "${RUNNER_TEMP}/semantic-evidence"

      - name: Prepare frozen pending Gold corpus
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/semantic-runtime/bin/deeplaw"
          printf '{"schema_version":"deeplaw.real-host-compile-command/v1","argv":["%s"],"prompt_transport":"stdin_utf8","timeout_seconds":7200,"max_output_bytes":16777216}\n' \
            "${runtime}" > "${RUNNER_TEMP}/deeplaw-command.json"
          uv run --frozen python -m benchmarks.semantic.prepare_host_corpus \
            --gold benchmarks/semantic/semantic-gold-candidate-v1.json \
            --vault "${RUNNER_TEMP}/semantic-vault" \
            --snapshot "${RUNNER_TEMP}/semantic-initial-snapshot" \
            --deeplaw-command "${RUNNER_TEMP}/deeplaw-command.json" \
            --allow-review-pending \
            --output "${RUNNER_TEMP}/corpus.json"

      - name: Run deterministic lifecycle, first-party queries, and host non-execution reports
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/semantic-evidence"
          corpus="${RUNNER_TEMP}/corpus.json"
          grant_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["grant_id"])' "${corpus}")
          uv run --frozen python -m benchmarks.semantic.run_deterministic_lifecycle \
            --gold benchmarks/semantic/semantic-gold-candidate-v1.json \
            --corpus "${corpus}" \
            --vault "${RUNNER_TEMP}/semantic-vault" \
            --baseline-vault "${RUNNER_TEMP}/semantic-baseline-vault" \
            --deeplaw-command "${RUNNER_TEMP}/deeplaw-command.json" \
            --output "${evidence}/deterministic-semantic-lifecycle-v2.json"
          uv run --frozen python -m benchmarks.semantic.run_query_suite \
            --gold benchmarks/semantic/semantic-gold-candidate-v1.json \
            --compiler-report "${evidence}/deterministic-semantic-lifecycle-v2.json" \
            --corpus "${corpus}" \
            --vault "${RUNNER_TEMP}/semantic-vault" \
            --baseline-vault "${RUNNER_TEMP}/semantic-baseline-vault" \
            --deeplaw-command "${RUNNER_TEMP}/deeplaw-command.json" \
            --output "${evidence}/semantic-query-report.json" \
            --cost-output "${evidence}/semantic-query-cost.json" \
            --context-output "${evidence}/semantic-context-outcome-v2.json"
          claude_observed=$("${RUNNER_TEMP}/host-cli/bin/claude" --version)
          opencode_observed=$("${RUNNER_TEMP}/host-cli/bin/opencode" --version)
          uv run --frozen python -m benchmarks.hosts.run_semantic_host_harness \
            --host claude_code --host-version 2.1.220 --model-identity not_executed \
            --grant-id "${grant_id}" --gold benchmarks/semantic/semantic-gold-candidate-v1.json \
            --corpus "${corpus}" --network-policy offline \
            --host-discovery-status discovered --version-command "claude --version" \
            --observed-version "${claude_observed}" \
            --authentication-status unavailable \
            --authentication-reason-code owner_scope_excludes_external_execution \
            --authentication-reason "No external model credential was supplied for the deterministic machine-consensus release scope." \
            --model-access-status unavailable \
            --model-access-reason-code owner_scope_excludes_external_execution \
            --model-access-reason "Paid external model execution is outside this owner-approved release scope." \
            --not-executed-reason "External real-model semantic execution is not required and was not executed." \
            --output "${evidence}/claude-code-real-model-not-executed.json"
          uv run --frozen python -m benchmarks.hosts.run_semantic_host_harness \
            --host opencode --host-version 1.18.16 --model-identity not_executed \
            --grant-id "${grant_id}" --gold benchmarks/semantic/semantic-gold-candidate-v1.json \
            --corpus "${corpus}" --network-policy offline \
            --host-discovery-status discovered --version-command "opencode --version" \
            --observed-version "${opencode_observed}" \
            --authentication-status unavailable \
            --authentication-reason-code owner_scope_excludes_external_execution \
            --authentication-reason "No external model credential was supplied for the deterministic machine-consensus release scope." \
            --model-access-status unavailable \
            --model-access-reason-code owner_scope_excludes_external_execution \
            --model-access-reason "Paid external model execution is outside this owner-approved release scope." \
            --not-executed-reason "External real-model semantic execution is not required and was not executed." \
            --output "${evidence}/opencode-real-model-not-executed.json"
          cp "${corpus}" "${evidence}/semantic-host-corpus.json"
          cp benchmarks/semantic/semantic-gold-candidate-v1.json "${evidence}/semantic-gold.json"
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload deterministic candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-deterministic-review-candidate
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/semantic-evidence/

  package-consensus:
    name: Package unanimous deterministic machine consensus
    if: ${{ inputs.mode == 'package_consensus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require exact candidate and evidence refs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.release_ref }}"
          test -n "${{ inputs.evidence_ref }}"

      - name: Check out the exact clean candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref }}

      - name: Check out sanitized post-candidate evidence
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.evidence_ref }}
          path: .release-evidence-input

      - name: Reject v0.13 and later candidates
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tuple(map(int, version.split("."))) >= (0, 13, 0):
              raise SystemExit("v0.13 must use the active qualification and Gate v9 path")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate and package exact machine-review evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          commit=$(git rev-parse HEAD)
          evidence_root=".release-evidence-input/release-evidence/${commit}"
          output="${RUNNER_TEMP}/semantic-release-evidence"
          test -d "${evidence_root}/semantic/machine-reviews"
          mkdir -p "${output}/machine-reviews" "${output}/quality"
          cp benchmarks/semantic/semantic-gold-candidate-v1.json \
            "${output}/semantic-gold.json"
          cp "${evidence_root}/semantic/deterministic-semantic-lifecycle.json" \
            "${output}/deterministic-semantic-lifecycle.json"
          cp "${evidence_root}/semantic/semantic-query-report.json" \
            "${output}/semantic-query-report.json"
          cp "${evidence_root}/semantic/semantic-query-cost.json" \
            "${output}/semantic-query-cost.json"
          cp "${evidence_root}/semantic/semantic-context-outcome-v2.json" \
            "${output}/semantic-context-outcome-v2.json"
          cp "${evidence_root}"/semantic/machine-reviews/*.json \
            "${output}/machine-reviews/"
          cp "${evidence_root}/quality/v0.12-28-source-decision-matrix.json" \
            "${output}/quality/v0.12-28-source-decision-matrix.json"
          packet_arguments=()
          packet_count=0
          for packet in "${output}"/machine-reviews/*.json; do
            packet_arguments+=(--packet "${packet}")
            packet_count=$((packet_count + 1))
          done
          test "${packet_count}" -eq 6
          uv run --frozen python -m benchmarks.semantic.build_machine_review_consensus \
            "${packet_arguments[@]}" --output "${output}"
          python - "${output}" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          forbidden = (b"/Users/", b"/private/", b"C:\\Users\\", b"PRIVATE KEY", b"api_key")
          for path in root.rglob("*"):
              if path.is_file() and any(marker.lower() in path.read_bytes().lower() for marker in forbidden):
                  raise SystemExit(f"release evidence contains forbidden material: {path.name}")
          PY
          rm -rf .release-evidence-input
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload formal deterministic semantic release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-release-evidence
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/semantic-release-evidence/
