name: Fast PR

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-pr:
    name: Lock, lint, diff, and focused contracts (Ubuntu Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock, source style, and patch integrity
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra discovery
          uv run --frozen ruff check .
          git diff --check
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          fi

      - name: Run focused public contracts
        run: >-
          uv run --frozen pytest --strict-markers -q
          tests/test_v013_pass21_task_routing_closure.py
          tests/test_v013_pass21_windows_acl_environment.py
          tests/test_v013_pass21_release_closure.py
          tests/test_v013_gate_validator_v1.py
          tests/test_v013_task_continuity_driver.py
          tests/test_closed_mcp_launcher.py
          tests/test_v013_pass16_host_version_binding.py
          tests/test_v013_commercial_release_gate.py
          tests/test_v013_platform_core_manifest.py
          tests/test_release_engineering.py

  windows-sentinel:
    name: Windows launcher, native ACL, environment, and continuity sentinel
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install focused dependencies
        run: uv sync --frozen --extra dev --extra discovery

      - name: Run native Windows sentinel
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run --frozen pytest --strict-markers -q
          tests/test_windows_acl.py
          tests/test_v013_pass21_windows_acl_environment.py
          tests/test_v013_no_model_production_registration.py::test_no_model_registration_starts_production_launcher_and_lists_tools
          tests/test_closed_mcp_launcher.py
          tests/test_v013_task_continuity_driver.py
          tests/test_v013_host_task_executor.py::test_admits_exact_six_slot_tree_transactionally
          tests/test_v013_host_task_executor.py::test_atomic_promotion_never_replaces_racing_output
          tests/test_v013_host_task_executor.py::test_chmod_failure_rolls_back_temporary_tree
          tests/test_v013_host_task_executor.py::test_post_rename_fsync_failure_is_reported_as_committed_uncertain
          tests/test_v013_host_task_executor.py::test_source_symlink_race_after_snapshot_cannot_escape_captured_bytes
          tests/test_v013_host_task_executor.py::test_symlink_and_hardlink_are_rejected
          tests/test_bounded_subprocess.py::test_bounded_subprocess_kills_descendants_that_inherit_output_pipes
          tests/test_bounded_subprocess.py::test_bounded_subprocess_reports_unavailable_pipes
          tests/test_v013_host_process_receipt_v2.py::test_production_seams_reject_unattested_codex_connection_and_synthetic_opencode_fork
          tests/test_v013_pass13_codex_qualification.py::test_codex_login_receipt_hashes_status_without_reading_auth_file
          tests/test_v013_pass13_codex_qualification.py::test_owner_broker_launcher_is_external_owner_only_and_process_separated
          tests/test_v013_pass13_opencode_qualification.py::test_owner_broker_launcher_must_be_owner_only_and_process_separated
          tests/test_v013_pass13_opencode_qualification.py::test_preflight_keeps_owner_broker_out_of_static_inspection_commands
          tests/test_v013_pass13_opencode_qualification.py::test_preflight_rejects_a_canary_resolved_into_debug_config
          tests/test_v013_pass13_opencode_qualification.py::test_resolved_config_must_bind_the_unique_installed_project_plugin
          tests/test_v013_pass13_opencode_qualification.py::test_windows_process_tree_cleanup_reports_unconfirmed_taskkill
          tests/test_v013_pass22_host_lifecycle.py::test_codex_adapter_process_accepts_only_closed_event_and_emits_receipt
          tests/test_v013_pass24_exact_wheel_runner.py::test_unique_wheel_is_installed_and_receipt_is_path_free
          tests/test_v013_pass24_exact_wheel_runner.py::test_version_probe_accepts_one_native_line_and_rejects_other_output
          tests/test_v013_pass24_exact_wheel_runner.py::test_public_journey_step_failure_cleans_venv
          tests/test_upstream_product_closure.py::test_public_seam_child_environment_keeps_windows_bootstrap_and_excludes_ambient
          tests/test_v013_pass22_continuity_closure.py::test_partial_checkpoint_recovers_after_process_exit_and_restart
