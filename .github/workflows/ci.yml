name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Candidate current-source regression ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra discovery

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Windows closed-environment preflight
        if: runner.os == 'Windows'
        run: >-
          uv run --frozen pytest --strict-markers -vv --maxfail=1
          tests/test_prd12_goal_route_identity_reproduction.py::test_prd12_goal_is_retrieval_only_and_not_route_identity
          tests/test_prd12_task_routing_reproduction.py::test_p0c_cli_cold_thread_task_text_only_recovery

      - name: Candidate current-source regression (not release readiness)
        shell: bash
        env:
          JUNIT_PATH: ${{ runner.temp }}/candidate-tests.xml
          RECEIPT_PATH: ${{ runner.temp }}/candidate-skip-receipt.json
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          uv run --frozen pytest --strict-markers --junitxml="${JUNIT_PATH}"
          python - "${JUNIT_PATH}" "${RECEIPT_PATH}" <<'PY'
          import json
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          junit_path = pathlib.Path(sys.argv[1])
          receipt_path = pathlib.Path(sys.argv[2])
          manifest = json.loads(
              pathlib.Path("benchmarks/release/platform-core-test-manifest-v1.json")
              .read_text(encoding="utf-8")
          )
          def identities(cases):
              return {
                  (case["junit"]["classname"], case["junit"]["name"])
                  for case in cases
              }
          qualification = identities(manifest["classifications"]["qualification"]["cases"])
          nonapplicable = identities(manifest["classifications"]["nonapplicable"]["cases"])
          historical_compatibility = identities(
              manifest["classifications"]["historical_compatibility"]["cases"]
          )
          root = ET.parse(junit_path).getroot()
          skipped = []
          for case in root.findall(".//testcase"):
              if case.find("skipped") is not None:
                  skipped.append((case.attrib.get("classname", ""), case.attrib.get("name", "")))
          unclassified = sorted(
              set(skipped) - qualification - nonapplicable - historical_compatibility
          )
          if unclassified:
              raise SystemExit(f"unclassified candidate skips: {unclassified[:8]}")
          suites = root.findall(".//testsuite")
          receipt = {
              "schema_version": "deeplaw.platform-candidate-regression-receipt/v1",
              "status": "current_source_regression",
              "release_ready": False,
              "environment": {
                  "matrix_os": os.environ["MATRIX_OS"],
                  "matrix_python": os.environ["MATRIX_PYTHON"],
                  "python_version": sys.version,
              },
              "test_manifest": {
                  "schema_version": manifest["schema_version"],
                  "manifest_sha256": manifest["manifest_sha256"],
              },
              "junit": {
                  "tests": sum(int(suite.attrib.get("tests", "0")) for suite in suites),
                  "failures": sum(int(suite.attrib.get("failures", "0")) for suite in suites),
                  "errors": sum(int(suite.attrib.get("errors", "0")) for suite in suites),
                  "skipped": len(skipped),
              },
              "qualification": {
                  "status": "not_executed",
                  "skipped": sum(identity in qualification for identity in skipped),
              },
              "nonapplicable": {
                  "status": "nonapplicable",
                  "skipped": sum(identity in nonapplicable for identity in skipped),
              },
              "historical_compatibility": {
                  "status": "not_executed",
                  "skipped": sum(
                      identity in historical_compatibility for identity in skipped
                  ),
              },
          }
          receipt_path.write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload candidate regression receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-regression-${{ matrix.os }}-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate-tests.xml
            ${{ runner.temp }}/candidate-skip-receipt.json

      - name: Build distribution
        run: uv build --build-constraints benchmarks/release/build-constraints.txt

      - name: Verify fresh wheel lifecycle
        run: uv run --frozen python -m benchmarks.verify_fresh_wheel --dist dist

      - name: Check patch whitespace
        run: git diff --check

  supply-chain:
    name: Supply chain and reproducible release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lockfile
        run: uv lock --check

      - name: Audit default dependencies
        run: uv run --frozen python -m benchmarks.release.audit_dependencies --profile default

      - name: Audit Discovery extra
        run: uv run --frozen python -m benchmarks.release.audit_dependencies --profile discovery

      - name: Audit document-engine extra with OpenVEX enforcement
        run: >-
          uv run --frozen python -m benchmarks.release.audit_dependencies
          --profile document-engine

      - name: Audit exact build environment
        run: uv run --frozen python -m benchmarks.release.audit_dependencies --profile build

      - name: Install all locked release profiles
        run: uv sync --frozen --extra dev --extra discovery --extra document-engine

      - name: Verify reproducible wheel, sdist, and package inventory
        run: >-
          uv run --frozen python -m benchmarks.release.verify_reproducible_build
          --output "${{ runner.temp }}/reproducible-build.json"

      - name: Generate CycloneDX SBOM
        run: >-
          uv export --quiet --frozen --all-extras --no-extra dev --no-dev
          --format cyclonedx1.5 --output-file "${{ runner.temp }}/deeplaw.cdx.json"

      - name: Scan installed licenses
        run: >-
          uv run --frozen python -m benchmarks.release.inventory_licenses
          --output "${{ runner.temp }}/installed-licenses.json"

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/deeplaw.cdx.json
            ${{ runner.temp }}/installed-licenses.json
            ${{ runner.temp }}/reproducible-build.json

  cross-platform-smoke:
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run CLI and MCP smoke tests
        run: >-
          uv run --frozen pytest
          tests/test_golden_cli.py
          tests/test_knowledge_cli_acceptance.py
          tests/test_knowledge_control.py
          tests/test_knowledge_mcp.py
          tests/test_knowledge_plugin.py
          tests/test_mcp_cli.py
          tests/test_operator_workbench.py
          tests/test_windows_acl.py

      - name: Build distribution
        run: uv build --build-constraints benchmarks/release/build-constraints.txt

      - name: Verify fresh wheel lifecycle
        run: uv run --frozen python -m benchmarks.verify_fresh_wheel --dist dist
