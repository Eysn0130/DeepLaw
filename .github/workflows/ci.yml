name: Fast PR

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-pr:
    name: Lock, lint, diff, and focused contracts (Ubuntu Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock, source style, and patch integrity
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra discovery
          uv run --frozen ruff check .
          git diff --check
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          fi

      - name: Run focused public contracts
        run: >-
          uv run --frozen pytest --strict-markers -q
          tests/test_v013_pass21_task_routing_closure.py
          tests/test_v013_pass21_windows_acl_environment.py
          tests/test_v013_pass21_release_closure.py
          tests/test_v013_gate_validator_v1.py
          tests/test_v013_task_continuity_driver.py
          tests/test_closed_mcp_launcher.py
          tests/test_v013_pass16_host_version_binding.py
          tests/test_v013_commercial_release_gate.py
          tests/test_v013_platform_core_manifest.py
          tests/test_release_engineering.py

  windows-sentinel:
    name: Windows launcher, native ACL, environment, and continuity sentinel
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install focused dependencies
        run: uv sync --frozen --extra dev

      - name: Run native Windows sentinel
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run --frozen pytest --strict-markers -q
          tests/test_windows_acl.py
          tests/test_v013_pass21_windows_acl_environment.py
          tests/test_closed_mcp_launcher.py
          tests/test_v013_task_continuity_driver.py
