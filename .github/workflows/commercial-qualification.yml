name: Commercial Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate Full run for this exact commit.
        required: true
        type: string
      evidence_run_id:
        description: Owner-controlled external qualification run with frozen raw evidence.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    name: Revalidate every Core Gate and assemble exact commercial assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify upstream run identities
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in "${CANDIDATE_RUN_ID}" "${EVIDENCE_RUN_ID}"; do
            [[ "${run_id}" =~ ^[0-9]+$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "${GITHUB_SHA}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .name)" = "Candidate Full"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq .name)" = "External Qualification Evidence"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .path)" = ".github/workflows/candidate-full.yml"

      - name: Download the one verified artifact source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Download owner-controlled external qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v013-qualification-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-assets

      - name: Install closed validator runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Inject only the exact verified distributions
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/release-assets/dist"
          mkdir "${RUNNER_TEMP}/release-assets/dist"
          cp "${RUNNER_TEMP}"/verified-dist/*.whl "${RUNNER_TEMP}/release-assets/dist/"
          cp "${RUNNER_TEMP}"/verified-dist/*.tar.gz "${RUNNER_TEMP}/release-assets/dist/"
          test ! -e "${RUNNER_TEMP}/release-assets/evidence/active-qualification.json"
          cp "${RUNNER_TEMP}/verified-dist/frozen-active-qualification.json" \
            "${RUNNER_TEMP}/release-assets/evidence/active-qualification.json"

      - name: Revalidate Gate collection and derive release decisions
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run --frozen python -m benchmarks.release.v013_commercial_release \
            --template "${RUNNER_TEMP}/release-assets/commercial-release-template.json" \
            --semantic-report evidence/gate-collection.json \
            --assets-root "${RUNNER_TEMP}/release-assets" \
            --output "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json"
          uv run --frozen python -m benchmarks.release.semantic_evidence \
            --manifest "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json" \
            --assets-root "${RUNNER_TEMP}/release-assets"
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from benchmarks.release.retained_artifact_manifest import verify_single_artifact_source
          verify_single_artifact_source(
              verified_dist=Path("${{ runner.temp }}/verified-dist"),
              consumer_dist=Path("${{ runner.temp }}/release-assets/dist"),
          )
          PY
          test -f "${RUNNER_TEMP}/release-assets/deeplaw.cdx.json"
          test -f "${RUNNER_TEMP}/release-assets/openvex.json"
          test -f "${RUNNER_TEMP}/release-assets/installed-licenses.json"
          test -f "${RUNNER_TEMP}/release-assets/provenance.json"

      - name: Retain exact commercial release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-release-assets
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/release-assets/
