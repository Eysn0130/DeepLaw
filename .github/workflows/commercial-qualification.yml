name: Commercial Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate Full run for this exact commit.
        required: true
        type: string
      evidence_run_id:
        description: Successful Kernel Qualification Evidence run for this exact commit.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    name: Recompute the 13 Kernel Release Core Gates from exact evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify distinct successful upstream runs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${EVIDENCE_RUN_ID}" =~ ^[0-9]+$ ]]
          test "${CANDIDATE_RUN_ID}" != "${EVIDENCE_RUN_ID}"
          test "${CANDIDATE_RUN_ID}" != "${QUALIFICATION_RUN_ID}"
          test "${EVIDENCE_RUN_ID}" != "${QUALIFICATION_RUN_ID}"
          verify_run() {
            local run_id="$1"
            local expected_name="$2"
            local expected_path="$3"
            local api="repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            test "$(gh api "${api}" --jq .status)" = completed
            test "$(gh api "${api}" --jq .conclusion)" = success
            test "$(gh api "${api}" --jq .head_sha)" = "${GITHUB_SHA}"
            test "$(gh api "${api}" --jq .name)" = "${expected_name}"
            test "$(gh api "${api}" --jq .path)" = "${expected_path}"
          }
          verify_run \
            "${CANDIDATE_RUN_ID}" \
            "Candidate Full" \
            ".github/workflows/candidate-full.yml"
          verify_run \
            "${EVIDENCE_RUN_ID}" \
            "Kernel Qualification Evidence" \
            ".github/workflows/kernel-qualification-evidence.yml"

      - name: Download the one verified artifact source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Download sanitized Kernel qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-qualification-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kernel-evidence-staging

      - name: Install the closed validator runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Build the run-bound Kernel bundle and assemble Gate v9
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev
          verified="${RUNNER_TEMP}/verified-dist"
          staging="${RUNNER_TEMP}/kernel-evidence-staging"
          staging_identity="${staging}/candidate-inventory/host-exact-identity.json"
          frozen_identity="${RUNNER_TEMP}/candidate-inputs/frozen-host-exact-identity.json"
          assets="${RUNNER_TEMP}/commercial-release-assets"
          bundle="${assets}/evidence/kernel-bundle"
          test ! -e "${assets}"
          test -f "${staging_identity}"
          test ! -L "${staging_identity}"
          test "$(find "${staging_identity}" -maxdepth 0 -type f ! -type l -print)" = "${staging_identity}"
          mkdir -p "${RUNNER_TEMP}/candidate-inputs"
          test ! -e "${frozen_identity}"
          test ! -L "${frozen_identity}"
          cp "${staging_identity}" "${frozen_identity}"
          test -f "${frozen_identity}"
          test ! -L "${frozen_identity}"
          chmod 600 "${frozen_identity}"
          test "$(stat -c '%a' "${frozen_identity}")" = "600"
          mkdir -p "${bundle}"
          test -z "$(find "${verified}" "${staging}" -type l -print -quit)"
          find "${verified}" -maxdepth 1 -type f -exec cp {} "${assets}/" \;
          cp -R "${staging}/." "${bundle}/"
          test ! -e "${bundle}/bundle-manifest.json"
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . --dist "${verified}" \
            --output "${verified}/retained-artifact-manifest.json" --verify
          uv run --frozen python -m benchmarks.release.kernel_qualification_bundle_v1 build \
            --root "${bundle}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --evidence-run-id "${EVIDENCE_RUN_ID}" \
            --qualification-run-id "${QUALIFICATION_RUN_ID}" \
            --host-identity-input "${frozen_identity}" \
            > "${assets}/kernel-bundle-validation.json"
          uv run --frozen python -m benchmarks.release.assemble_commercial_qualification_v9 \
            --bundle-root "${bundle}" \
            --output-root "${assets}" \
            > "${assets}/commercial-qualification-v9.json"
          release_commit="$(git rev-parse HEAD)"
          release_tree="$(git rev-parse HEAD^{tree})"
          uv run --frozen python -m benchmarks.release.release_provenance_v9 \
            --write \
            --release-manifest "${assets}/commercial-release-manifest.json" \
            --assets-root "${assets}" \
            --bundle-root "${bundle}" \
            --report "${assets}/evidence/commercial-evidence-report.json" \
            --pre-publish-receipt "${assets}/pre-publish-artifact-gate.json" \
            --release-commit "${release_commit}" \
            --release-tree "${release_tree}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --evidence-run-id "${EVIDENCE_RUN_ID}" \
            --qualification-run-id "${QUALIFICATION_RUN_ID}" \
            > "${assets}/release-provenance-v9-validation.json"
          ASSETS_ROOT="${assets}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ASSETS_ROOT"])
          manifest = json.loads(
              (root / "commercial-release-manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("release_ready") is not True:
              raise SystemExit("Kernel Release Core did not pass every Gate")
          if manifest.get("kernel_release_claim_eligible") is not True:
              raise SystemExit("Kernel release claim is not mechanically eligible")
          if manifest.get("human_attested_claim_eligible") is not False:
              raise SystemExit("unexpected human attestation claim")
          if manifest.get("competitive_claim_eligible") is not False:
              raise SystemExit("unexpected competitive claim")
          PY

      - name: Retain exact v9 commercial release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-release-assets
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: ${{ runner.temp }}/commercial-release-assets/
