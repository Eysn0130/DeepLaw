name: Periodic Scale

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate Full run that retained the verified artifact.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve-candidate:
    name: Resolve one successful frozen Candidate Full run
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
    steps:
      - name: Resolve exact run and source commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${REQUESTED_RUN_ID}"
          if [[ -z "${run_id}" ]]; then
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/candidate-full.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)
          workflow=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .name)
          workflow_path=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .path)
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)
          test "${conclusion}" = success
          test "${workflow}" = "Candidate Full"
          test "${workflow_path}" = ".github/workflows/candidate-full.yml"
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

  scale:
    name: Wiki, Relation, request, RSS, storage, and latency scale
    needs: resolve-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact Candidate Full source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-candidate.outputs.head_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download the one verified artifact source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Verify artifact identity
        run: |
          uv sync --frozen --extra dev --extra discovery
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . \
            --dist "${RUNNER_TEMP}/verified-dist" \
            --output "${RUNNER_TEMP}/verified-dist/retained-artifact-manifest.json" \
            --verify

      - name: Execute model-free frozen scale lanes
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "${RUNNER_TEMP}/verified-dist" -maxdepth 1 -type f -name '*.whl')
          uv run --frozen python -m benchmarks.v013.scale_performance \
            --output "${RUNNER_TEMP}/scale-performance.json" \
            --scale 1000 --scale 10000 --scale 100000 \
            --query-runs 3 --warmup-runs 1 \
            --rss-requests 10000 --execute-expensive
          uv run --frozen python -m benchmarks.v013.query_graph_scale \
            --output "${RUNNER_TEMP}/relation-100000.json" \
            --scale 100000 --execute-expensive --candidate-wheel "${wheel}"
          uv run --frozen python -m benchmarks.v013.runtime_stability \
            --output "${RUNNER_TEMP}/runtime-10000.json" \
            --request-count 10000 --warmup-requests 100 --execute-10k \
            --workspace "${RUNNER_TEMP}/runtime-workspace"

      - name: Retain exact model-free scale evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: periodic-scale-${{ needs.resolve-candidate.outputs.head_sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/scale-performance.json
            ${{ runner.temp }}/relation-100000.json
            ${{ runner.temp }}/runtime-10000.json
