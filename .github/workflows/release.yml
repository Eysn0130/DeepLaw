name: Release verified DeepLaw candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v0.13 tag.
        required: true
        type: string
      candidate_run_id:
        description: Successful Candidate Full run for the exact tag commit.
        required: true
        type: string
      qualification_run_id:
        description: Successful Commercial Qualification run for the same artifact hashes.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: Resolve exact tag, Candidate Full, and qualification runs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      candidate_run_id: ${{ steps.release.outputs.candidate_run_id }}
      qualification_run_id: ${{ steps.release.outputs.qualification_run_id }}
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Validate exact release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CANDIDATE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id || '' }}
          REQUESTED_QUALIFICATION_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_run_id || '' }}
          TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "${TARGET_TAG}" = "v0.13.0"
          commit=$(git rev-parse HEAD)
          test "${commit}" = "$(git rev-list -n 1 "${TARGET_TAG}")"
          version=$(python - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          test "${TARGET_TAG}" = "v${version}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          resolve_run() {
            local requested="$1"
            local workflow_file="$2"
            if [[ -n "${requested}" ]]; then
              printf '%s' "${requested}"
            else
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.head_sha == \"${commit}\")] | first | .id"
            fi
          }
          candidate_run_id=$(resolve_run "${REQUESTED_CANDIDATE_RUN}" candidate-full.yml)
          qualification_run_id=$(resolve_run "${REQUESTED_QUALIFICATION_RUN}" commercial-qualification.yml)
          verify_run() {
            local run_id="$1"
            local expected_path="$2"
            [[ "${run_id}" =~ ^[0-9]+$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "${commit}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .path)" = "${expected_path}"
          }
          verify_run "${candidate_run_id}" ".github/workflows/candidate-full.yml"
          verify_run "${qualification_run_id}" ".github/workflows/commercial-qualification.yml"
          echo "tag=${TARGET_TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "candidate_run_id=${candidate_run_id}" >> "${GITHUB_OUTPUT}"
          echo "qualification_run_id=${qualification_run_id}" >> "${GITHUB_OUTPUT}"

  validate-assets:
    name: Revalidate exact artifact, Core Gate collection, and supply-chain evidence
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Download Candidate Full verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Download exact qualification assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commercial-release-assets
          run-id: ${{ needs.resolve.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify one artifact source and all commercial evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . \
            --dist "${RUNNER_TEMP}/verified-dist" \
            --output "${RUNNER_TEMP}/verified-dist/retained-artifact-manifest.json" \
            --verify
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from benchmarks.release.retained_artifact_manifest import verify_single_artifact_source
          verify_single_artifact_source(
              verified_dist=Path("${{ runner.temp }}/verified-dist"),
              consumer_dist=Path("${{ runner.temp }}/release-assets/dist"),
          )
          PY
          uv run --frozen python -m benchmarks.release.semantic_evidence \
            --manifest "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json" \
            --assets-root "${RUNNER_TEMP}/release-assets"
          uv run --frozen python -m benchmarks.release.release_policy \
            --manifest "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json" \
            --release-version "${{ needs.resolve.outputs.version }}"
          test -f "${RUNNER_TEMP}/release-assets/deeplaw.cdx.json"
          test -f "${RUNNER_TEMP}/release-assets/openvex.json"
          test -f "${RUNNER_TEMP}/release-assets/installed-licenses.json"
          test -f "${RUNNER_TEMP}/release-assets/provenance.json"

  fresh-install:
    name: Fresh install ${{ matrix.os }} Python ${{ matrix.python-version }}
    needs:
      - resolve
      - validate-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the same verified wheel and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Fresh install and execute public CLI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "verified-dist"
          manifest = json.loads(
              (root / "retained-artifact-manifest.json").read_text(encoding="utf-8")
          )
          expected = {manifest["wheel"]["filename"], manifest["sdist"]["filename"]}
          observed = {
              path.name
              for path in root.iterdir()
              if path.is_file()
              and (path.name.endswith(".whl") or path.name.endswith(".tar.gz"))
          }
          if observed != expected:
              raise SystemExit("fresh install artifact names differ from retained manifest")
          hashes = []
          for kind in ("wheel", "sdist"):
              item = manifest[kind]
              path = root / item["filename"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"] or path.stat().st_size != item["bytes"]:
                  raise SystemExit(f"fresh install {kind} differs from retained manifest")
              hashes.append(digest)
          print(json.dumps({
              "schema_version": "deeplaw.fresh-install-verified-artifact/v1",
              "status": "verified",
              "artifact_sha256": hashes,
          }, sort_keys=True, separators=(",", ":")))
          PY
          wheel=$(find "${RUNNER_TEMP}/verified-dist" -maxdepth 1 -type f -name '*.whl')
          test -n "${wheel}"
          uv venv "${RUNNER_TEMP}/fresh" --python "${{ matrix.python-version }}" --seed
          if [[ "${{ runner.os }}" == Windows ]]; then
            python_path="${RUNNER_TEMP}/fresh/Scripts/python.exe"
            cli_path="${RUNNER_TEMP}/fresh/Scripts/deeplaw.exe"
          else
            python_path="${RUNNER_TEMP}/fresh/bin/python"
            cli_path="${RUNNER_TEMP}/fresh/bin/deeplaw"
          fi
          uv pip install --python "${python_path}" "${wheel}"
          "${cli_path}" --version

  publish:
    name: Sign, attest, and publish the already verified bytes
    needs:
      - resolve
      - validate-assets
      - fresh-install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download the same verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publish

      - name: Download exact commercial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commercial-release-assets
          run-id: ${{ needs.resolve.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/commercial

      - name: Copy closed public evidence and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/commercial/commercial-release-manifest.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/deeplaw.cdx.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/openvex.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/installed-licenses.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/provenance.json" "${RUNNER_TEMP}/publish/"
          cd "${RUNNER_TEMP}/publish"
          sha256sum -- * > SHA256SUMS

      - name: Create Sigstore bundles for exact wheel and sdist
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            ${{ runner.temp }}/publish/*.whl
            ${{ runner.temp }}/publish/*.tar.gz

      - name: Attest exact distributions and SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/publish/*.whl
            ${{ runner.temp }}/publish/*.tar.gz
          sbom-path: ${{ runner.temp }}/publish/deeplaw.cdx.json

      - name: Create or resume the release without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes
          fi
          release_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)
          while IFS= read -r -d '' artifact; do
            name=$(basename "${artifact}")
            asset_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .id")
            if [[ -n "${asset_id}" ]]; then
              existing=$(mktemp -d)
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "${existing}/${name}"
              cmp --silent "${artifact}" "${existing}/${name}" || {
                echo "published release asset differs: ${name}" >&2
                exit 1
              }
            else
              gh release upload "${RELEASE_TAG}" "${artifact}"
            fi
          done < <(find "${RUNNER_TEMP}/publish" -maxdepth 1 -type f -print0 | sort -z)

  public-redownload:
    name: Verify public redownload and signature bundles
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Install verification tooling
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Publicly redownload immutable release without credentials
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/downloads"
          cd "${RUNNER_TEMP}/downloads"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --silent --show-error \
            --output SHA256SUMS "${base}/SHA256SUMS"
          while read -r _hash name; do
            [[ "${name}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
            curl --fail --location --silent --show-error \
              --output "${name}" "${base}/${name}"
          done < SHA256SUMS
          sha256sum --check SHA256SUMS
          for artifact in *.whl *.tar.gz; do
            curl --fail --location --silent --show-error \
              --output "${artifact}.sigstore.json" \
              "${base}/${artifact}.sigstore.json"
            test -f "${artifact}.sigstore.json"
            uvx --from sigstore==4.3.0 sigstore verify identity \
              --bundle "${artifact}.sigstore.json" \
              --cert-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
            gh attestation verify "${artifact}" --repo "${GITHUB_REPOSITORY}"
          done
