name: Publish DeepLaw release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to publish or resume.
        required: true
        type: string
        default: "v0.12.0"
      post_release_only:
        description: Verify an already published release without rebuilding or resigning it.
        required: true
        type: boolean
        default: false
      semantic_evidence_run_id:
        description: Successful finalize-mode Semantic evidence run; auto-resolved for the exact commit when empty.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  release-context:
    name: Resolve immutable release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      tree: ${{ steps.release.outputs.tree }}
      version: ${{ steps.release.outputs.version }}
      semantic_evidence_run_id: ${{ steps.release.outputs.semantic_evidence_run_id }}

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Validate exact tag, version, and commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SEMANTIC_EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.semantic_evidence_run_id || '' }}
          TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse "${commit}^{tree}")
          tag_commit=$(git rev-list -n 1 "${TARGET_TAG}")
          [[ "${commit}" == "${tag_commit}" ]]
          version=$(python - "${TARGET_TAG}" <<'PY'
          import pathlib
          import sys
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())[
              "project"
          ]["version"]
          if sys.argv[1] != f"v{version}":
              raise SystemExit("tag and package version differ")
          notes = pathlib.Path(f"docs/RELEASE_NOTES_v{version}.md")
          if not notes.is_file():
              raise SystemExit("release notes for the package version are missing")
          print(version)
          PY
          )
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          semantic_run_id="${SEMANTIC_EVIDENCE_RUN_ID}"
          if [[ -z "${semantic_run_id}" ]]; then
            semantic_run_id=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/semantic-evidence.yml/runs?status=success&event=workflow_dispatch&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${commit}\")] | first | .id")
          fi
          [[ "${semantic_run_id}" =~ ^[0-9]+$ ]]
          semantic_artifact_count=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${semantic_run_id}/artifacts" \
            --jq '[.artifacts[] | select(.name == "semantic-release-evidence" and .expired == false)] | length')
          [[ "${semantic_artifact_count}" -eq 1 ]]
          echo "tag=${TARGET_TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "semantic_evidence_run_id=${semantic_run_id}" >> "${GITHUB_OUTPUT}"

  commercial-gates:
    name: Reuse exact commercial GA evidence
    needs: release-context
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.post_release_only }}
    uses: ./.github/workflows/commercial-gates.yml
    with:
      release_ref: ${{ needs.release-context.outputs.tag }}
      semantic_evidence_run_id: ${{ needs.release-context.outputs.semantic_evidence_run_id }}
    permissions:
      actions: read
      contents: read

  publish:
    name: Sign, attest, and publish exact verified bytes
    needs:
      - release-context
      - commercial-gates
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.post_release_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Download exact verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commercial-release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Validate version-conditional commercial manifest
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmarks.release.release_policy \
            --manifest "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json" \
            --release-version "${RELEASE_VERSION}"

      - name: Validate the frozen commercial decision
        env:
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
          RELEASE_TREE: ${{ needs.release-context.outputs.tree }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1]).resolve(strict=True)
          assets_root = manifest_path.parent
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          release = manifest.get("release", {})
          major, minor, _patch = (int(part) for part in os.environ["RELEASE_VERSION"].split("."))
          legacy_v5 = (major, minor) < (0, 13)
          legacy_failed = legacy_v5 and (
              manifest.get("evaluation_protocol", {}).get("quality_gate_passed") is not True
              or manifest.get("evaluation_protocol", {}).get("freeze_valid") is not True
              or manifest.get("living_wiki_quality", {}).get("passed") is not True
              or manifest.get("living_wiki_quality", {}).get("quality_regression") is not False
              or manifest.get("living_wiki_quality", {}).get("performance_regression") is not False
              or manifest.get("authoritative_source_quality", {}).get("passed") is not True
              or manifest.get("authoritative_source_quality", {}).get("source_count") != 28
              or manifest.get("semantic_living_wiki_quality", {}).get("passed") is not True
              or manifest.get("semantic_living_wiki_quality", {}).get("formal_release_eligible")
              is not True
              or manifest.get("editor_integrations", {}).get("passed") is not True
              or manifest.get("authoritative_evidence_quality", {}).get("passed") is not True
          )
          if (
              manifest.get("commercial_release_eligible") is not True
              or manifest.get("quality_protocol_eligible") is not True
              or manifest.get("competitive_claim_eligible") is not False
              or legacy_failed
              or release.get("tag") != os.environ["RELEASE_TAG"]
              or release.get("commit") != os.environ["RELEASE_COMMIT"]
              or release.get("tree") != os.environ["RELEASE_TREE"]
          ):
              raise SystemExit("commercial release decision does not bind the exact tag")

          files_by_name = {}
          for path in sorted(assets_root.rglob("*")):
              if not path.is_file():
                  continue
              if path.name in files_by_name:
                  raise SystemExit(f"duplicate release asset basename: {path.name}")
              files_by_name[path.name] = path
          checksum_path = assets_root / "SHA256SUMS"
          listed_names = set()
          for line in checksum_path.read_text(encoding="utf-8").splitlines():
              digest, separator, name = line.partition("  ")
              if (
                  separator != "  "
                  or len(digest) != 64
                  or any(character not in "0123456789abcdef" for character in digest)
                  or not name
                  or name in listed_names
                  or "/" in name
                  or "\\" in name
              ):
                  raise SystemExit("release checksum manifest is malformed")
              listed_names.add(name)
              path = files_by_name.get(name)
              if path is None:
                  raise SystemExit(f"checksummed release asset is missing: {name}")
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != digest:
                  raise SystemExit(f"release checksum differs: {name}")
          expected_names = set(files_by_name) - {checksum_path.name}
          if listed_names != expected_names:
              raise SystemExit("release checksum inventory is incomplete")
          manifest_asset_names = set()
          for record in manifest.get("artifacts", []):
              logical_path = record.get("path")
              if not isinstance(logical_path, str) or not logical_path:
                  raise SystemExit("commercial manifest contains an invalid artifact path")
              name = pathlib.PurePosixPath(logical_path).name
              if not name or name in manifest_asset_names:
                  raise SystemExit("commercial manifest artifact basenames must be unique")
              manifest_asset_names.add(name)
              path = files_by_name.get(name)
              if path is None:
                  raise SystemExit(f"commercial manifest asset is missing: {logical_path}")
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != record.get("sha256") or path.stat().st_size != record.get(
                  "byte_size"
              ):
                  raise SystemExit(f"commercial manifest bytes differ: {logical_path}")
          PY

      - name: Create and verify Sigstore OIDC bundles
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            ${{ runner.temp }}/release-assets/dist/*.whl
            ${{ runner.temp }}/release-assets/dist/*.tar.gz
            ${{ runner.temp }}/release-assets/oci/*.oci.tar
            ${{ runner.temp }}/release-assets/sbom/*.json
            ${{ runner.temp }}/release-assets/licenses/*.json
            ${{ runner.temp }}/release-assets/security/openvex.json
            ${{ runner.temp }}/release-assets/evaluation/*.json
            ${{ runner.temp }}/release-assets/evaluation/*.md
            ${{ runner.temp }}/release-assets/evaluation/EVALUATION_SHA256SUMS
            ${{ runner.temp }}/release-assets/quality/*.json
            ${{ runner.temp }}/release-assets/documentation/*.md
            ${{ runner.temp }}/release-assets/commercial-release-manifest.json
            ${{ runner.temp }}/release-assets/SHA256SUMS
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false
          upload-signing-artifacts: false

      - name: Attest provenance for every checksummed asset
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS

      - name: Attest CycloneDX SBOM for every checksummed asset
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS
          sbom-path: ${{ runner.temp }}/release-assets/sbom/deeplaw-${{ needs.release-context.outputs.version }}.cdx.json

      - name: Flatten uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/release-assets" "${RUNNER_TEMP}/publish" <<'PY'
          import pathlib
          import shutil
          import sys

          source = pathlib.Path(sys.argv[1]).resolve(strict=True)
          target = pathlib.Path(sys.argv[2])
          target.mkdir(parents=True)
          files = sorted(path for path in source.rglob("*") if path.is_file())
          names = [path.name for path in files]
          if not files or len(names) != len(set(names)):
              raise SystemExit("release asset basenames must be unique")
          for path in files:
              shutil.copyfile(path, target / path.name)
          PY

      - name: Create or resume the release without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          releases_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          matching_releases=$(jq -c --arg tag "${RELEASE_TAG}" \
            '[.[] | select(.tag_name == $tag)]' <<< "${releases_json}")
          release_count=$(jq 'length' <<< "${matching_releases}")
          [[ "${release_count}" -le 1 ]]
          if [[ "${release_count}" -eq 0 ]]; then
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --target "${RELEASE_COMMIT}" --draft \
              --title "DeepLaw ${RELEASE_TAG} — Formal Release" \
              --notes-file "docs/RELEASE_NOTES_v${RELEASE_VERSION}.md"
            for attempt in 1 2 3 4 5; do
              releases_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
              matching_releases=$(jq -c --arg tag "${RELEASE_TAG}" \
                '[.[] | select(.tag_name == $tag)]' <<< "${releases_json}")
              release_count=$(jq 'length' <<< "${matching_releases}")
              [[ "${release_count}" -le 1 ]]
              if [[ "${release_count}" -eq 1 ]]; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "draft release was not observable after bounded retries" >&2
                exit 1
              fi
              sleep "${attempt}"
            done
          fi
          release_json=$(jq -c '.[0]' <<< "${matching_releases}")
          release_id=$(jq -r '.id' <<< "${release_json}")
          release_is_draft=$(jq -r '.draft' <<< "${release_json}")
          [[ "$(jq -r '.tag_name' <<< "${release_json}")" == "${RELEASE_TAG}" ]]
          [[ "$(jq -r '.target_commitish' <<< "${release_json}")" == "${RELEASE_COMMIT}" ]]
          [[ "$(jq -r '.prerelease' <<< "${release_json}")" == "false" ]]
          [[ "${release_is_draft}" == "true" || "${release_is_draft}" == "false" ]]
          echo "RELEASE_ID=${release_id}" >> "${GITHUB_ENV}"
          for asset in "${RUNNER_TEMP}"/publish/*; do
            name=$(basename "${asset}")
            [[ "${name}" =~ ^[A-Za-z0-9._-]+$ ]]
            local_digest="sha256:$(sha256sum "${asset}" | cut -d ' ' -f 1)"
            matching_assets=$(jq -c --arg name "${name}" \
              '[.assets[] | select(.name == $name)]' <<< "${release_json}")
            asset_count=$(jq 'length' <<< "${matching_assets}")
            [[ "${asset_count}" -le 1 ]]
            if [[ "${asset_count}" -eq 1 ]]; then
              remote_digest=$(jq -r '.[0].digest // empty' <<< "${matching_assets}")
              test -n "${remote_digest}"
              [[ "${remote_digest}" == "${local_digest}" ]]
            else
              [[ "${release_is_draft}" == "true" ]]
              curl --fail-with-body --silent --show-error --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@${asset}" \
                --output "${RUNNER_TEMP}/uploaded-release-asset.json" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}"
              release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
              remote_digest=$(jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .digest // empty' <<< "${release_json}")
              [[ "${remote_digest}" == "${local_digest}" ]]
            fi
          done

      - name: Publish the fully populated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          [[ "$(jq -r '.tag_name' <<< "${release_json}")" == "${RELEASE_TAG}" ]]
          [[ "$(jq -r '.prerelease' <<< "${release_json}")" == "false" ]]
          if [[ "$(jq -r '.draft' <<< "${release_json}")" == "true" ]]; then
            jq --arg tag "${RELEASE_TAG}" --arg commit "${RELEASE_COMMIT}" \
              '
              .tag_name = $tag
              | .target_commitish = $commit
              | .draft = false
              | .prerelease = false
              | .make_latest = "true"
              | {tag_name, target_commitish, name, body, draft, prerelease, make_latest}
              ' \
              <<< "${release_json}" > "${RUNNER_TEMP}/publish-release.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --input "${RUNNER_TEMP}/publish-release.json" \
              > "${RUNNER_TEMP}/published-release.json"
          fi
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          jq -er --arg tag "${RELEASE_TAG}" \
            'select(.tag_name == $tag and .draft == false and .prerelease == false) | .html_url' \
            <<< "${release_json}"

  post-release:
    name: Verify public release download and clean reinstall
    needs:
      - release-context
      - publish
    if: >-
      ${{ always() && needs.release-context.result == 'success' &&
      (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.post_release_only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: read

    steps:
      - name: Check out exact public release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download public GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/downloads" "${RUNNER_TEMP}/post-evidence"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/downloads"
          release_url=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,url --jq 'select(.isDraft == false) | .url')
          test -n "${release_url}"
          echo "RELEASE_URL=${release_url}" >> "${GITHUB_ENV}"

      - name: Validate version-conditional downloaded manifest
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmarks.release.release_policy \
            --manifest "${RUNNER_TEMP}/downloads/commercial-release-manifest.json" \
            --release-version "${RELEASE_VERSION}"

      - name: Verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/downloads"
          sha256sum --check SHA256SUMS \
            | tee "${RUNNER_TEMP}/post-evidence/checksum-verification.log"

      - name: Verify Sigstore identity bundles
        shell: bash
        env:
          RELEASE_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ needs.release-context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/post-evidence/sigstore-verification.log") 2>&1
          required_signed_assets=(
            "deeplaw-${RELEASE_VERSION}-py3-none-any.whl"
            "deeplaw-${RELEASE_VERSION}.tar.gz"
            "deeplaw-${RELEASE_VERSION}-linux-amd64.oci.tar"
            "deeplaw-${RELEASE_VERSION}.cdx.json"
            "deeplaw-${RELEASE_VERSION}-licenses.json"
            "commercial-release-manifest.json"
            "openvex.json"
            "SHA256SUMS"
          )
          for artifact_name in "${required_signed_assets[@]}"; do
            test -f "${RUNNER_TEMP}/downloads/${artifact_name}"
            test -f "${RUNNER_TEMP}/downloads/${artifact_name}.sigstore.json"
          done
          verified_bundle_count=0
          while IFS= read -r -d '' bundle; do
            artifact="${bundle%.sigstore.json}"
            test -f "${artifact}"
            uvx --from sigstore==4.3.0 sigstore verify identity \
              --bundle "${bundle}" \
              --cert-identity "${RELEASE_CERT_IDENTITY}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "${artifact}"
            verified_bundle_count=$((verified_bundle_count + 1))
          done < <(
            find "${RUNNER_TEMP}/downloads" -maxdepth 1 -type f \
              -name '*.sigstore.json' -print0 | sort -z
          )
          [[ "${verified_bundle_count}" -ge "${#required_signed_assets[@]}" ]]

      - name: Verify GitHub provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r _digest name; do
            gh attestation verify "${RUNNER_TEMP}/downloads/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            printf 'verified provenance: %s\n' "${name}"
          done < "${RUNNER_TEMP}/downloads/SHA256SUMS" \
            2>&1 | tee "${RUNNER_TEMP}/post-evidence/provenance-verification.log"
          for name in \
            "deeplaw-${RELEASE_VERSION}-py3-none-any.whl" \
            "deeplaw-${RELEASE_VERSION}.tar.gz" \
            "deeplaw-${RELEASE_VERSION}-linux-amd64.oci.tar"; do
            gh attestation verify "${RUNNER_TEMP}/downloads/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --predicate-type https://cyclonedx.org/bom
            printf 'verified CycloneDX SBOM: %s\n' "${name}"
          done 2>&1 | tee "${RUNNER_TEMP}/post-evidence/sbom-verification.log"

      - name: Build exact v0.6.0 upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          legacy_source="${RUNNER_TEMP}/deeplaw-v060-source"
          legacy_dist="${RUNNER_TEMP}/deeplaw-v060-dist"
          git worktree add --detach "${legacy_source}" e0f1fe3ff01d3026df12673d57c69014c2c4dca4
          uv build --project "${legacy_source}" --wheel --out-dir "${legacy_dist}"
          legacy_wheel=$(find "${legacy_dist}" -maxdepth 1 -type f \
            -name 'deeplaw-0.6.0-*.whl' -print -quit)
          test -n "${legacy_wheel}"
          echo "LEGACY_WHEEL=${legacy_wheel}" >> "${GITHUB_ENV}"

      - name: Clean-install formal wheel and sdist, upgrade, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run --frozen python -m benchmarks.release.run_distribution_lifecycle \
            --dist "${RUNNER_TEMP}/downloads" \
            --legacy-wheel "${LEGACY_WHEEL}" \
            --output "${RUNNER_TEMP}/post-evidence/post-release-distribution-lifecycle.json"
          formal_wheel="${RUNNER_TEMP}/downloads/deeplaw-${{ needs.release-context.outputs.version }}-py3-none-any.whl"
          formal_runtime="${RUNNER_TEMP}/formal-quality-runtime"
          uv venv --python 3.12 --no-project "${formal_runtime}"
          uv pip install --python "${formal_runtime}/bin/python" "${formal_wheel}"
          formal_wheel_sha256=$(sha256sum "${formal_wheel}" | awk '{print $1}')
          uv run --frozen python -m benchmarks.living_wiki.run_quality_gate \
            --deeplaw "${formal_runtime}/bin/deeplaw" \
            --candidate-role formal_release \
            --candidate-commit "${{ needs.release-context.outputs.commit }}" \
            --artifact-sha256 "${formal_wheel_sha256}" \
            --output \
              "${RUNNER_TEMP}/post-evidence/formal-release-living-wiki-quality.json"
          uv run --frozen python -m benchmarks.release.post_release_verify \
            --downloads "${RUNNER_TEMP}/downloads" \
            --lifecycle \
              "${RUNNER_TEMP}/post-evidence/post-release-distribution-lifecycle.json" \
            --checksum-log "${RUNNER_TEMP}/post-evidence/checksum-verification.log" \
            --signature-log "${RUNNER_TEMP}/post-evidence/sigstore-verification.log" \
            --provenance-log "${RUNNER_TEMP}/post-evidence/provenance-verification.log" \
            --formal-quality \
              "${RUNNER_TEMP}/post-evidence/formal-release-living-wiki-quality.json" \
            --release-url "${RELEASE_URL}" \
            --output "${RUNNER_TEMP}/post-evidence/post-release-verification.json"

      - name: Sign and verify post-release verification
        env:
          CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/post-evidence/post-release-verification.json"
          bundle="${artifact}.sigstore.json"
          uvx --from sigstore==4.3.0 sigstore sign \
            --bundle "${bundle}" \
            "${artifact}"
          uvx --from sigstore==4.3.0 sigstore verify identity \
            --bundle "${bundle}" \
            --cert-identity "${CERT_IDENTITY}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            "${artifact}"

      - name: Attach or verify post-release evidence without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          for asset in \
            "${RUNNER_TEMP}/post-evidence/checksum-verification.log" \
            "${RUNNER_TEMP}/post-evidence/sigstore-verification.log" \
            "${RUNNER_TEMP}/post-evidence/provenance-verification.log" \
            "${RUNNER_TEMP}/post-evidence/sbom-verification.log" \
            "${RUNNER_TEMP}/post-evidence/post-release-distribution-lifecycle.json" \
            "${RUNNER_TEMP}/post-evidence/formal-release-living-wiki-quality.json" \
            "${RUNNER_TEMP}/post-evidence/post-release-verification.json" \
            "${RUNNER_TEMP}/post-evidence/post-release-verification.json.sigstore.json"; do
            name=$(basename "${asset}")
            local_digest="sha256:$(sha256sum "${asset}" | cut -d ' ' -f 1)"
            remote_digest=$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .digest // empty' <<< "${release_json}")
            if [[ -n "${remote_digest}" ]]; then
              [[ "${remote_digest}" == "${local_digest}" ]]
            else
              gh release upload "${RELEASE_TAG}" "${asset}" \
                --repo "${GITHUB_REPOSITORY}"
              release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
            fi
          done
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,url --jq \
            'select(.isDraft == false and .isPrerelease == false) | .url'
