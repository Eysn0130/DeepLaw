name: Release verified DeepLaw candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v0.13 tag.
        required: true
        type: string
      candidate_run_id:
        description: Successful Candidate Full run for the exact tag commit.
        required: true
        type: string
      evidence_run_id:
        description: Successful Kernel Qualification Evidence run for the same candidate.
        required: true
        type: string
      qualification_run_id:
        description: Successful machine-only Commercial Qualification run for the same artifact hashes.
        required: true
        type: string
      owner_release_confirmation:
        description: Exact owner confirmation required to publish v0.13.0.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: Resolve exact tag, Candidate Full, Kernel evidence, and qualification
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      tree: ${{ steps.release.outputs.tree }}
      version: ${{ steps.release.outputs.version }}
      candidate_run_id: ${{ steps.release.outputs.candidate_run_id }}
      evidence_run_id: ${{ steps.release.outputs.evidence_run_id }}
      qualification_run_id: ${{ steps.release.outputs.qualification_run_id }}
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Validate exact release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          REQUESTED_EVIDENCE_RUN: ${{ inputs.evidence_run_id }}
          REQUESTED_QUALIFICATION_RUN: ${{ inputs.qualification_run_id }}
          TARGET_TAG: ${{ inputs.release_tag }}
          OWNER_RELEASE_CONFIRMATION: ${{ inputs.owner_release_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          test "${OWNER_RELEASE_CONFIRMATION}" = "publish-v0.13.0"
          test "${TARGET_TAG}" = "v0.13.0"
          test "${GITHUB_REF}" = "refs/tags/${TARGET_TAG}"
          commit=$(git rev-parse HEAD)
          test "${commit}" = "$(git rev-list -n 1 "${TARGET_TAG}")"
          version=$(python - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          test "${TARGET_TAG}" = "v${version}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          tree=$(git rev-parse HEAD^{tree})

          candidate_run_id="${REQUESTED_CANDIDATE_RUN}"
          evidence_run_id="${REQUESTED_EVIDENCE_RUN}"
          qualification_run_id="${REQUESTED_QUALIFICATION_RUN}"
          test "${candidate_run_id}" != "${evidence_run_id}"
          test "${candidate_run_id}" != "${qualification_run_id}"
          test "${evidence_run_id}" != "${qualification_run_id}"
          verify_run() {
            local run_id="$1"
            local expected_name="$2"
            local expected_path="$3"
            [[ "${run_id}" =~ ^[0-9]+$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .name)" = "${expected_name}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .path)" = "${expected_path}"
          }
          verify_run \
            "${candidate_run_id}" \
            "Candidate Full" \
            ".github/workflows/candidate-full.yml"
          verify_run \
            "${evidence_run_id}" \
            "Kernel Qualification Evidence" \
            ".github/workflows/kernel-qualification-evidence.yml"
          verify_run \
            "${qualification_run_id}" \
            "Commercial Qualification" \
            ".github/workflows/commercial-qualification.yml"
          candidate_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}" --jq .head_sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${evidence_run_id}" --jq .head_sha)" = "${candidate_head}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq .head_sha)" = "${candidate_head}"
          echo "tag=${TARGET_TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "candidate_run_id=${candidate_run_id}" >> "${GITHUB_OUTPUT}"
          echo "evidence_run_id=${evidence_run_id}" >> "${GITHUB_OUTPUT}"
          echo "qualification_run_id=${qualification_run_id}" >> "${GITHUB_OUTPUT}"

  validate-assets:
    name: Revalidate exact artifact, Core Gate collection, and supply-chain evidence
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Download Candidate Full verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Download sanitized Kernel qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-qualification-evidence
          run-id: ${{ needs.resolve.outputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kernel-evidence-staging

      - name: Download exact qualification assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commercial-release-assets
          run-id: ${{ needs.resolve.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify one artifact source and the exact embedded Kernel bundle
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . \
            --dist "${RUNNER_TEMP}/verified-dist" \
            --output "${RUNNER_TEMP}/verified-dist/retained-artifact-manifest.json" \
            --verify
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from benchmarks.release.retained_artifact_manifest import verify_single_artifact_source
          verify_single_artifact_source(
              verified_dist=Path("${{ runner.temp }}/verified-dist"),
              consumer_dist=Path("${{ runner.temp }}/release-assets"),
          )
          PY
          STAGING_SOURCE="${RUNNER_TEMP}/kernel-evidence-staging" \
          EMBEDDED_BUNDLE="${RUNNER_TEMP}/release-assets/evidence/kernel-bundle" \
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          def inventory(root: Path, *, exclude_manifest: bool):
              root = root.resolve(strict=True)
              result = {}
              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit("Kernel qualification evidence contains a symlink")
                  if path.is_file():
                      relative = path.relative_to(root).as_posix()
                      if exclude_manifest and relative == "bundle-manifest.json":
                          continue
                      raw = path.read_bytes()
                      result[relative] = (hashlib.sha256(raw).hexdigest(), len(raw))
              if not result:
                  raise SystemExit("Kernel qualification evidence is empty")
              return result

          source = inventory(Path(os.environ["STAGING_SOURCE"]), exclude_manifest=False)
          embedded = inventory(Path(os.environ["EMBEDDED_BUNDLE"]), exclude_manifest=True)
          if source != embedded:
              raise SystemExit("commercial assets do not embed the exact Kernel evidence")
          PY
          uv run --frozen python -m benchmarks.release.kernel_qualification_bundle_v1 validate \
            --root "${RUNNER_TEMP}/release-assets/evidence/kernel-bundle" \
            --candidate-run-id "${{ needs.resolve.outputs.candidate_run_id }}" \
            --evidence-run-id "${{ needs.resolve.outputs.evidence_run_id }}" \
            --qualification-run-id "${{ needs.resolve.outputs.qualification_run_id }}"

      - name: Reopen all transitive commercial evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m benchmarks.release.release_provenance_v9 \
            --write \
            --release-manifest \
              "${RUNNER_TEMP}/release-assets/commercial-release-manifest.json" \
            --assets-root "${RUNNER_TEMP}/release-assets" \
            --bundle-root "${RUNNER_TEMP}/release-assets/evidence/kernel-bundle" \
            --report "${RUNNER_TEMP}/release-assets/evidence/commercial-evidence-report.json" \
            --pre-publish-receipt \
              "${RUNNER_TEMP}/release-assets/pre-publish-artifact-gate.json" \
            --release-commit "${{ needs.resolve.outputs.commit }}" \
            --release-tree "${{ needs.resolve.outputs.tree }}" \
            --candidate-run-id "${{ needs.resolve.outputs.candidate_run_id }}" \
            --evidence-run-id "${{ needs.resolve.outputs.evidence_run_id }}" \
            --qualification-run-id "${{ needs.resolve.outputs.qualification_run_id }}"
          test -f "${RUNNER_TEMP}/release-assets/deeplaw.cdx.json"
          test -f "${RUNNER_TEMP}/release-assets/openvex.json"
          test -f "${RUNNER_TEMP}/release-assets/installed-licenses.json"
          test -f "${RUNNER_TEMP}/release-assets/reproducible-build.json"

      - name: Retain the release-bound commercial evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bound-commercial-assets
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: ${{ runner.temp }}/release-assets/

  fresh-install:
    name: Fresh install ${{ matrix.os }} Python ${{ matrix.python-version }}
    needs:
      - resolve
      - validate-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the same verified wheel and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dist

      - name: Fresh install and execute public CLI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "verified-dist"
          manifest = json.loads(
              (root / "retained-artifact-manifest.json").read_text(encoding="utf-8")
          )
          expected = {manifest["wheel"]["filename"], manifest["sdist"]["filename"]}
          observed = {
              path.name
              for path in root.iterdir()
              if path.is_file()
              and (path.name.endswith(".whl") or path.name.endswith(".tar.gz"))
          }
          if observed != expected:
              raise SystemExit("fresh install artifact names differ from retained manifest")
          hashes = []
          for kind in ("wheel", "sdist"):
              item = manifest[kind]
              path = root / item["filename"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"] or path.stat().st_size != item["bytes"]:
                  raise SystemExit(f"fresh install {kind} differs from retained manifest")
              hashes.append(digest)
          print(json.dumps({
              "schema_version": "deeplaw.fresh-install-verified-artifact/v1",
              "status": "verified",
              "artifact_sha256": hashes,
          }, sort_keys=True, separators=(",", ":")))
          PY
          wheel=$(find "${RUNNER_TEMP}/verified-dist" -maxdepth 1 -type f -name '*.whl')
          test -n "${wheel}"
          uv venv "${RUNNER_TEMP}/fresh" --python "${{ matrix.python-version }}" --seed
          if [[ "${{ runner.os }}" == Windows ]]; then
            python_path="${RUNNER_TEMP}/fresh/Scripts/python.exe"
            cli_path="${RUNNER_TEMP}/fresh/Scripts/deeplaw.exe"
          else
            python_path="${RUNNER_TEMP}/fresh/bin/python"
            cli_path="${RUNNER_TEMP}/fresh/bin/deeplaw"
          fi
          uv pip install --python "${python_path}" "${wheel}"
          "${cli_path}" --version

  publish:
    name: Sign, attest, and publish the already verified bytes
    needs:
      - resolve
      - validate-assets
      - fresh-install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download the same verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publish

      - name: Download exact commercial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bound-commercial-assets
          path: ${{ runner.temp }}/commercial

      - name: Copy closed public evidence and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/commercial/commercial-release-manifest.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/deeplaw.cdx.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/openvex.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/installed-licenses.json" "${RUNNER_TEMP}/publish/"
          cp "${RUNNER_TEMP}/commercial/reproducible-build.json" "${RUNNER_TEMP}/publish/"
          cd "${RUNNER_TEMP}/publish"
          sha256sum -- * > SHA256SUMS

      - name: Create Sigstore bundles for exact wheel and sdist
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            ${{ runner.temp }}/publish/*.whl
            ${{ runner.temp }}/publish/*.tar.gz

      - name: Attest exact distribution provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/publish/*.whl
            ${{ runner.temp }}/publish/*.tar.gz

      - name: Attest exact distributions and SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/publish/*.whl
            ${{ runner.temp }}/publish/*.tar.gz
          sbom-path: ${{ runner.temp }}/publish/deeplaw.cdx.json

      - name: Create or resume the draft or public prerelease without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          allowed_assets=$(mktemp)
          find "${RUNNER_TEMP}/publish" -maxdepth 1 -type f -print0 \
            | while IFS= read -r -d '' artifact; do basename "${artifact}"; done \
            | sort -u > "${allowed_assets}"
          printf '%s\n' post-public-verification.json >> "${allowed_assets}"
          sort -u -o "${allowed_assets}" "${allowed_assets}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)
            remote_assets=$(mktemp)
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[].name' | sort -u > "${remote_assets}"
            extra_assets=$(comm -23 "${remote_assets}" "${allowed_assets}")
            if [[ -n "${extra_assets}" ]]; then
              echo "remote release contains assets outside the local publish allowlist:" >&2
              printf '%s\n' "${extra_assets}" >&2
              exit 1
            fi
          fi
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --verify-tag --draft --prerelease --generate-notes
          else
            test "$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)" = true
          fi
          release_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)
          while IFS= read -r -d '' artifact; do
            name=$(basename "${artifact}")
            asset_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .id")
            if [[ -n "${asset_id}" ]]; then
              existing=$(mktemp -d)
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "${existing}/${name}"
              cmp --silent "${artifact}" "${existing}/${name}" || {
                echo "published release asset differs: ${name}" >&2
                exit 1
              }
            else
              gh release upload "${RELEASE_TAG}" "${artifact}"
            fi
          done < <(find "${RUNNER_TEMP}/publish" -maxdepth 1 -type f -print0 | sort -z)
          while IFS= read -r -d '' artifact; do
            name=$(basename "${artifact}")
            asset_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .id")
            test -n "${asset_id}"
            observed=$(mktemp -d)
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "${observed}/${name}"
            cmp --silent "${artifact}" "${observed}/${name}" || {
              echo "draft release asset differs after upload: ${name}" >&2
              exit 1
            }
          done < <(find "${RUNNER_TEMP}/publish" -maxdepth 1 -type f -print0 | sort -z)

      - name: Publish the verified draft as a public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = true ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          else
            test "$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)" = true
          fi

  public-redownload:
    name: Verify public redownload and signature bundles
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Check out exact release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Install verification tooling
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Install closed receipt validator
        run: uv sync --frozen --extra dev

      - name: Publicly redownload immutable release without credentials
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/downloads"
          cd "${RUNNER_TEMP}/downloads"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --silent --show-error \
            --output SHA256SUMS "${base}/SHA256SUMS"
          while read -r _hash name; do
            [[ "${name}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
            curl --fail --location --silent --show-error \
              --output "${name}" "${base}/${name}"
          done < SHA256SUMS
          sha256sum --check SHA256SUMS
          for artifact in *.whl *.tar.gz; do
            curl --fail --location --silent --show-error \
              --output "${artifact}.sigstore.json" \
              "${base}/${artifact}.sigstore.json"
            test -f "${artifact}.sigstore.json"
            uvx --from sigstore==4.3.0 sigstore verify identity \
              --bundle "${artifact}.sigstore.json" \
              --cert-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
          done

      - name: Download and verify public provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/downloads"
          for artifact in *.whl *.tar.gz; do
            digest="$(sha256sum "${artifact}" | cut -d ' ' -f 1)"
            bundle="sha256:${digest}.jsonl"
            gh attestation download "${artifact}" --repo "${GITHUB_REPOSITORY}"
            test -s "${bundle}"
            gh attestation verify "${artifact}" \
              --bundle "${bundle}" \
              --repo "${GITHUB_REPOSITORY}" \
              --cert-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${{ needs.resolve.outputs.tag }}"
            gh attestation verify "${artifact}" \
              --bundle "${bundle}" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type "https://cyclonedx.org/bom/v1.5" \
              --cert-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${{ needs.resolve.outputs.tag }}"
          done

      - name: Derive and validate post-public verification receipt
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TREE: ${{ needs.resolve.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/downloads"
          uv --directory "${GITHUB_WORKSPACE}" run --frozen python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import stat
          from datetime import datetime, timezone
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def require_regular(path: Path) -> None:
              try:
                  mode = path.lstat().st_mode
              except FileNotFoundError as exc:
                  raise SystemExit(f"required public asset is missing: {path.name}") from exc
              if path.is_symlink() or not stat.S_ISREG(mode):
                  raise SystemExit(f"required public asset is not a regular file: {path.name}")

          def set_digest(paths: list[Path]) -> str:
              rows = [{"name": path.name, "sha256": sha(path)} for path in sorted(paths)]
              raw = json.dumps(rows, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          wheels = sorted(Path.cwd().glob("*.whl"))
          sdists = sorted(Path.cwd().glob("*.tar.gz"))
          sigstore = sorted(Path.cwd().glob("*.sigstore.json"))
          attestations = sorted(Path.cwd().glob("sha256:*.jsonl"))
          if len(wheels) != 1 or len(sdists) != 1 or len(sigstore) != 2 or len(attestations) != 2:
              raise SystemExit("post-public verification artifact inventory is incomplete")
          checksums = Path("SHA256SUMS")
          commercial_manifest = Path("commercial-release-manifest.json")
          for path in [checksums, commercial_manifest, *wheels, *sdists, *sigstore, *attestations]:
              require_regular(path)
          for line in checksums.read_text(encoding="utf-8").splitlines():
              columns = line.split()
              if len(columns) != 2 or len(columns[0]) != 64:
                  raise SystemExit("SHA256SUMS contains a malformed entry")
              listed = Path(columns[1].removeprefix("*"))
              if listed.name != columns[1].removeprefix("*"):
                  raise SystemExit("SHA256SUMS contains an unsafe asset name")
              require_regular(listed)
          manifest = json.loads(commercial_manifest.read_text(encoding="utf-8"))
          release = manifest.get("release")
          expected_release = {
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
              "tree": os.environ["RELEASE_TREE"],
          }
          if not isinstance(release, dict) or any(
              release.get(key) != value for key, value in expected_release.items()
          ):
              raise SystemExit("public commercial manifest is not bound to the immutable release")
          wheel_sha = sha(wheels[0])
          sdist_sha = sha(sdists[0])
          binding = {"wheel_sha256": wheel_sha, "sdist_sha256": sdist_sha}
          release_binding = {
              **expected_release,
              "commercial_manifest_sha256": sha(commercial_manifest),
              "sha256s_sha256": sha(checksums),
          }
          receipt = {
              "schema_version": "deeplaw.post-public-verification/v2",
              "status": "post_public_verified",
              "verified_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "release_binding": release_binding,
              "artifact_binding": binding,
              "sigstore": {
                  "identity": "sigstore-github-release-workflow",
                  "bundle_sha256": set_digest(sigstore),
                  "verified": True,
              },
              "attestation": {
                  "identity": "github-release-provenance-and-sbom",
                  "attestation_sha256": set_digest(attestations),
                  "verified": True,
              },
              "anonymous_redownload": {
                  "attempt_id": (
                      f"release-run-{os.environ['RELEASE_RUN_ID']}-"
                      f"{os.environ['RELEASE_RUN_ATTEMPT']}"
                  ),
                  "source": "anonymous_public_redownload",
                  **binding,
                  "sha256_matches": True,
              },
              "public_sha256": binding,
              "public_release_verified": True,
          }
          canonical = json.dumps(
              receipt,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          receipt["record_sha256"] = hashlib.sha256(canonical).hexdigest()
          schema_path = Path(os.environ["GITHUB_WORKSPACE"]) / "contracts" / (
              "post-public-verification.v2.schema.json"
          )
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          errors = sorted(
              Draft202012Validator(
                  schema,
                  format_checker=FormatChecker(),
              ).iter_errors(receipt),
              key=lambda error: list(error.path),
          )
          if errors:
              raise SystemExit(f"post-public receipt schema violation: {errors[0].message}")
          Path("post-public-verification.json").write_text(
              json.dumps(
                  receipt,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain post-public verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-public-verification
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/downloads/post-public-verification.json

      - name: Attach post-public receipt and clear prerelease state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/downloads/post-public-verification.json"
          release_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)
          asset_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | select(.name == "post-public-verification.json") | .id')
          if [[ -n "${asset_id}" ]]; then
            observed=$(mktemp -d)
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "${observed}/post-public-verification.json"
            cmp --silent "${receipt}" "${observed}/post-public-verification.json" || {
              echo "post-public verification receipt differs" >&2
              exit 1
            }
          else
            gh release upload "${RELEASE_TAG}" "${receipt}"
          fi
          gh release edit "${RELEASE_TAG}" --prerelease=false
