name: Commercial GA gates

on:
  pull_request:
  workflow_call:
    inputs:
      release_ref:
        description: Exact tag or commit to validate; defaults to the triggering commit.
        required: false
        type: string
        default: ""
      semantic_evidence_run_id:
        description: Successful package-consensus Semantic evidence workflow run ID.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact tag or commit to validate; defaults to the triggering commit.
        required: false
        type: string
        default: ""
      semantic_evidence_run_id:
        description: Successful package-consensus Semantic evidence workflow run ID.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  build-distributions:
    name: Reproducible wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify source and build exact distributions
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev
          uv run --frozen ruff check .
          uv run --frozen python -m benchmarks.release.verify_reproducible_build \
            --artifact-dir dist \
            --output "${RUNNER_TEMP}/reproducible-build.json"
          uv run --frozen python -m benchmarks.verify_fresh_wheel --dist dist
          git diff --check
          cp "${RUNNER_TEMP}/reproducible-build.json" dist/reproducible-build.json

      - name: Upload verified distribution bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-dist
          if-no-files-found: error
          path: dist/

  platform-gates:
    name: ${{ matrix.system }} Python ${{ matrix.python }} mandatory gate
    needs: build-distributions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: Linux
            python: "3.11"
            slug: linux-py311
            marker: not windows_native
          - os: ubuntu-latest
            system: Linux
            python: "3.12"
            slug: linux-py312
            marker: not windows_native
          - os: ubuntu-latest
            system: Linux
            python: "3.13"
            slug: linux-py313
            marker: not windows_native
          - os: macos-latest
            system: Darwin
            python: "3.11"
            slug: darwin-py311
            marker: not windows_native
          - os: macos-latest
            system: Darwin
            python: "3.12"
            slug: darwin-py312
            marker: not windows_native
          - os: macos-latest
            system: Darwin
            python: "3.13"
            slug: darwin-py313
            marker: not windows_native
          - os: windows-latest
            system: Windows
            python: "3.11"
            slug: windows-py311
            marker: all
          - os: windows-latest
            system: Windows
            python: "3.12"
            slug: windows-py312
            marker: all
          - os: windows-latest
            system: Windows
            python: "3.13"
            slug: windows-py313
            marker: all

    steps:
      - name: Check out exact candidate and history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download exact verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dist
          path: ${{ runner.temp }}/verified-dist

      - name: Build exact historical v0.6.0 migration and upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          legacy_source="${RUNNER_TEMP}/deeplaw-v060-source"
          legacy_dist="${RUNNER_TEMP}/deeplaw-v060-dist"
          git worktree add --detach "${legacy_source}" e0f1fe3ff01d3026df12673d57c69014c2c4dca4
          uv build --project "${legacy_source}" --wheel --out-dir "${legacy_dist}"
          python - "${legacy_dist}" >> "${GITHUB_ENV}" <<'PY'
          import hashlib
          import pathlib
          import sys

          wheels = list(pathlib.Path(sys.argv[1]).glob("deeplaw-0.6.0-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one v0.6.0 wheel")
          wheel = wheels[0].resolve()
          print(f"DEEPLAW_V060_WHEEL={wheel}")
          print(f"DEEPLAW_V060_WHEEL_SHA256={hashlib.sha256(wheel.read_bytes()).hexdigest()}")
          PY

      - name: Install mandatory test profile
        run: uv sync --frozen --extra dev --extra discovery

      - name: Run full mandatory suite with zero skips
        shell: bash
        env:
          MATRIX_MARKER: ${{ matrix.marker }}
          JUNIT_PATH: ${{ runner.temp }}/pytest-${{ matrix.slug }}.xml
        run: |
          set -euo pipefail
          uv lock --check
          uv run --frozen ruff check .
          if [[ "${MATRIX_MARKER}" == "all" ]]; then
            uv run --frozen pytest --strict-markers --junitxml="${JUNIT_PATH}"
          else
            uv run --frozen pytest --strict-markers -m "${MATRIX_MARKER}" \
              --junitxml="${JUNIT_PATH}"
          fi
          git diff --check

      - name: Exercise exact distribution lifecycle
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m benchmarks.release.run_distribution_lifecycle \
            --dist "${RUNNER_TEMP}/verified-dist" \
            --legacy-wheel "${DEEPLAW_V060_WHEEL}" \
            --output "${RUNNER_TEMP}/distribution-lifecycle-${{ matrix.slug }}.json"

      - name: Freeze platform report
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m benchmarks.release.platform_gate \
            --junit "${RUNNER_TEMP}/pytest-${{ matrix.slug }}.xml" \
            --lifecycle "${RUNNER_TEMP}/distribution-lifecycle-${{ matrix.slug }}.json" \
            --expected-system "${{ matrix.system }}" \
            --expected-python "${{ matrix.python }}" \
            --output "${RUNNER_TEMP}/platform-${{ matrix.slug }}.json"
          mkdir -p "${RUNNER_TEMP}/platform-evidence"
          cp "${RUNNER_TEMP}/pytest-${{ matrix.slug }}.xml" \
            "${RUNNER_TEMP}/platform-evidence/pytest-${{ matrix.slug }}.xml"
          cp "${RUNNER_TEMP}/distribution-lifecycle-${{ matrix.slug }}.json" \
            "${RUNNER_TEMP}/platform-evidence/distribution-lifecycle-${{ matrix.slug }}.json"
          cp "${RUNNER_TEMP}/platform-${{ matrix.slug }}.json" \
            "${RUNNER_TEMP}/platform-evidence/platform-${{ matrix.slug }}.json"

      - name: Upload platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.slug }}
          if-no-files-found: error
          path: ${{ runner.temp }}/platform-evidence/

  no-model-hosts:
    name: Official CLI no-model host acceptance
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate and history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Download exact verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dist
          path: ${{ runner.temp }}/verified-dist

      - name: Install candidate and pinned official host CLIs
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv venv --python 3.12 --no-project "${RUNNER_TEMP}/host-runtime"
          candidate_wheels=("${RUNNER_TEMP}"/verified-dist/deeplaw-*.whl)
          [[ "${#candidate_wheels[@]}" -eq 1 ]]
          uv pip install --python "${RUNNER_TEMP}/host-runtime/bin/python" \
            "${candidate_wheels[0]}"
          npm install --global --prefix "${RUNNER_TEMP}/host-clis" \
            @openai/codex@0.145.0 \
            @anthropic-ai/claude-code@2.1.220 \
            opencode-ai@1.18.8
          echo "${RUNNER_TEMP}/host-clis/bin" >> "${GITHUB_PATH}"

      - name: Run isolated lifecycle and MCP handshake without a model
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m benchmarks.hosts.run_no_model_host_acceptance \
            --codex "${RUNNER_TEMP}/host-clis/bin/codex" \
            --claude "${RUNNER_TEMP}/host-clis/bin/claude" \
            --opencode "${RUNNER_TEMP}/host-clis/bin/opencode" \
            --deeplaw "${RUNNER_TEMP}/host-runtime/bin/deeplaw" \
            --codex-version 0.145.0 \
            --claude-version 2.1.220 \
            --opencode-version 1.18.8 \
            --output "${RUNNER_TEMP}/no-model-host-acceptance.json"

      - name: Upload host evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: no-model-host-acceptance
          if-no-files-found: error
          path: ${{ runner.temp }}/no-model-host-acceptance.json

  oci:
    name: Non-root networkless OCI
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download exact verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dist
          path: ${{ runner.temp }}/verified-dist

      - name: Build and exercise OCI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          version=$(python - <<'PY'
          import pathlib
          import tomllib

          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          context="${RUNNER_TEMP}/oci-context"
          evidence="${RUNNER_TEMP}/oci-evidence"
          mkdir -p "${context}" "${evidence}"
          cp packaging/oci/Dockerfile "${context}/Dockerfile"
          candidate_wheels=("${RUNNER_TEMP}"/verified-dist/deeplaw-*.whl)
          [[ "${#candidate_wheels[@]}" -eq 1 ]]
          cp "${candidate_wheels[0]}" "${context}/"
          release_commit=$(git rev-parse HEAD)
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file "${context}/runtime-requirements.txt"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg DEEPLAW_VERSION="${version}" \
            --build-arg VCS_REF="${release_commit}" \
            --build-arg SOURCE_DATE_EPOCH=946684800 \
            --output "type=oci,dest=${evidence}/deeplaw-${version}-linux-amd64.oci.tar" \
            "${context}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg DEEPLAW_VERSION="${version}" \
            --build-arg VCS_REF="${release_commit}" \
            --build-arg SOURCE_DATE_EPOCH=946684800 \
            --load \
            --tag "deeplaw:${version}-local" \
            "${context}"
          container_id=$(docker create \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "deeplaw:${version}-local")
          docker inspect "${container_id}" > "${evidence}/container-inspect.json"
          docker start --attach "${container_id}" > "${evidence}/runtime-output.txt"
          docker rm "${container_id}"
          cp "${context}/runtime-requirements.txt" "${evidence}/runtime-requirements.txt"
          uv run --frozen python -m benchmarks.release.verify_oci \
            --archive "${evidence}/deeplaw-${version}-linux-amd64.oci.tar" \
            --requirements "${evidence}/runtime-requirements.txt" \
            --container-inspect "${evidence}/container-inspect.json" \
            --output "${evidence}/oci-release-report.json"

      - name: Upload OCI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-oci
          if-no-files-found: error
          path: ${{ runner.temp }}/oci-evidence/

  evaluation-protocol:
    name: Evaluation Protocol v1
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate and freeze history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download exact verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dist
          path: ${{ runner.temp }}/verified-dist

      - name: Run and independently verify the frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          candidate_wheels=("${RUNNER_TEMP}"/verified-dist/deeplaw-*.whl)
          [[ "${#candidate_wheels[@]}" -eq 1 ]]
          runtime="${RUNNER_TEMP}/evaluation-runtime"
          uv venv --python 3.12 --no-project "${runtime}"
          uv pip install --python "${runtime}/bin/python" "${candidate_wheels[0]}"
          "${runtime}/bin/python" -m benchmarks.evaluation.run_protocol \
            --repository . \
            --candidate-wheel "${candidate_wheels[0]}" \
            --output-dir "${RUNNER_TEMP}/evaluation-protocol" \
            --require-eligible
          "${runtime}/bin/python" -m benchmarks.evaluation.run_protocol \
            --repository . \
            --verify-report-dir "${RUNNER_TEMP}/evaluation-protocol" \
            --require-eligible
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload frozen evaluation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-protocol
          if-no-files-found: error
          path: ${{ runner.temp }}/evaluation-protocol/

  living-wiki-quality:
    name: Living Wiki baseline and fresh-wheel quality
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download exact verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dist
          path: ${{ runner.temp }}/verified-dist

      - name: Run same-condition baseline and exact-wheel quality suites
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev

          baseline_commit="42382b264f4297965c25aaac6e85619e9e0d49b7"
          baseline_source="${RUNNER_TEMP}/living-wiki-baseline-source"
          baseline_dist="${RUNNER_TEMP}/living-wiki-baseline-dist"
          baseline_runtime="${RUNNER_TEMP}/living-wiki-baseline-runtime"
          git worktree add --detach "${baseline_source}" "${baseline_commit}"
          SOURCE_DATE_EPOCH=946684800 PYTHONHASHSEED=0 TZ=UTC \
            uv build --project "${baseline_source}" --wheel \
              --build-constraints \
                "${baseline_source}/benchmarks/release/build-constraints.txt" \
              --out-dir "${baseline_dist}"
          baseline_wheels=("${baseline_dist}"/deeplaw-0.10.0-*.whl)
          [[ "${#baseline_wheels[@]}" -eq 1 ]]
          uv venv --python 3.12 --no-project "${baseline_runtime}"
          uv pip install --python "${baseline_runtime}/bin/python" \
            "${baseline_wheels[0]}"
          baseline_wheel_sha256=$(sha256sum "${baseline_wheels[0]}" | awk '{print $1}')
          [[ "${baseline_wheel_sha256}" == \
            "9bda60831e4380092c9a3bdb80103b5ec8abbf5a2be0adf6ffd57f61cfa46ca0" ]]
          uv run --frozen python -m benchmarks.living_wiki.run_quality_gate \
            --deeplaw "${baseline_runtime}/bin/deeplaw" \
            --candidate-role baseline \
            --candidate-commit "${baseline_commit}" \
            --artifact-sha256 "${baseline_wheel_sha256}" \
            --allow-fail \
            --output "${RUNNER_TEMP}/living-wiki-quality-baseline.json"

          candidate_runtime="${RUNNER_TEMP}/living-wiki-quality-runtime"
          uv venv --python 3.12 --no-project "${candidate_runtime}"
          candidate_wheels=("${RUNNER_TEMP}"/verified-dist/deeplaw-*.whl)
          [[ "${#candidate_wheels[@]}" -eq 1 ]]
          uv pip install --python "${candidate_runtime}/bin/python" \
            "${candidate_wheels[0]}"
          wheel_sha256=$(sha256sum "${candidate_wheels[0]}" | awk '{print $1}')
          uv run --frozen python -m benchmarks.living_wiki.run_quality_gate \
            --deeplaw "${candidate_runtime}/bin/deeplaw" \
            --candidate-role fresh_wheel \
            --candidate-commit "$(git rev-parse HEAD)" \
            --artifact-sha256 "${wheel_sha256}" \
            --output "${RUNNER_TEMP}/living-wiki-quality-report.json"
          uv run --frozen python -m benchmarks.living_wiki.compare_quality \
            --baseline "${RUNNER_TEMP}/living-wiki-quality-baseline.json" \
            --candidate "${RUNNER_TEMP}/living-wiki-quality-report.json" \
            --output "${RUNNER_TEMP}/living-wiki-quality-comparison.json"
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload Living Wiki quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-wiki-quality
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/living-wiki-quality-baseline.json
            ${{ runner.temp }}/living-wiki-quality-report.json
            ${{ runner.temp }}/living-wiki-quality-comparison.json

  assemble:
    name: Assemble commercial manifest
    if: ${{ inputs.semantic_evidence_run_id != '' }}
    needs:
      - build-distributions
      - platform-gates
      - no-model-hosts
      - oci
      - evaluation-protocol
      - living-wiki-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download gate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: ${{ runner.temp }}/gate-evidence

      - name: Download exact reviewed semantic evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semantic-release-evidence
          path: ${{ runner.temp }}/semantic-release-evidence
          run-id: ${{ inputs.semantic_evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Audit all profiles and assemble normalized assets
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra discovery --extra document-engine
          version=$(python - <<'PY'
          import pathlib
          import tomllib

          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          assets="${RUNNER_TEMP}/release-assets"
          mkdir -p "${assets}/dist" "${assets}/evidence" "${assets}/oci" \
            "${assets}/security" "${assets}/sbom" "${assets}/licenses" \
            "${assets}/evaluation" "${assets}/quality" \
            "${assets}/documentation" "${assets}/semantic/machine-reviews" \
            "${assets}/editors"
          cp "${RUNNER_TEMP}"/gate-evidence/verified-dist/deeplaw-"${version}"-*.whl \
            "${assets}/dist/"
          cp "${RUNNER_TEMP}"/gate-evidence/verified-dist/deeplaw-"${version}".tar.gz \
            "${assets}/dist/"
          cp "${RUNNER_TEMP}/gate-evidence/verified-dist/reproducible-build.json" \
            "${assets}/evidence/reproducible-build.json"
          cp "${RUNNER_TEMP}"/gate-evidence/platform-*/* "${assets}/evidence/"
          cp "${RUNNER_TEMP}/gate-evidence/no-model-host-acceptance/no-model-host-acceptance.json" \
            "${assets}/evidence/no-model-host-acceptance.json"
          cp "${RUNNER_TEMP}/gate-evidence/verified-oci/deeplaw-${version}-linux-amd64.oci.tar" \
            "${assets}/oci/"
          cp "${RUNNER_TEMP}/gate-evidence/verified-oci/oci-release-report.json" \
            "${assets}/evidence/oci-release-report.json"
          cp "${RUNNER_TEMP}/gate-evidence/verified-oci/runtime-requirements.txt" \
            "${assets}/oci/runtime-requirements.txt"
          for name in evaluation-report.json repository-development.json \
            repository-temporal-holdout.json autonomy-safety.json \
            typed-compiler-quality.json EVALUATION_REPORT.md; do
            cp "${RUNNER_TEMP}/gate-evidence/evaluation-protocol/${name}" \
              "${assets}/evaluation/${name}"
          done
          cp "${RUNNER_TEMP}/gate-evidence/evaluation-protocol/SHA256SUMS" \
            "${assets}/evaluation/EVALUATION_SHA256SUMS"
          cp "${RUNNER_TEMP}/gate-evidence/living-wiki-quality/living-wiki-quality-report.json" \
            "${assets}/quality/living-wiki-quality-report.json"
          cp "${RUNNER_TEMP}/gate-evidence/living-wiki-quality/living-wiki-quality-baseline.json" \
            "${assets}/quality/living-wiki-quality-baseline.json"
          cp "${RUNNER_TEMP}/gate-evidence/living-wiki-quality/living-wiki-quality-comparison.json" \
            "${assets}/quality/living-wiki-quality-comparison.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/quality/v0.12-28-source-decision-matrix.json" \
            "${assets}/quality/v0.12-28-source-decision-matrix.json"
          uv run --frozen python -m benchmarks.legal.run_authoritative_evidence_gate \
            --repository . \
            --evaluation-report "${assets}/evaluation/evaluation-report.json" \
            --output "${assets}/quality/authoritative-evidence-quality.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/semantic-gold.json" \
            "${assets}/semantic/semantic-gold.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/deterministic-semantic-lifecycle.json" \
            "${assets}/semantic/deterministic-semantic-lifecycle.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/semantic-query-report.json" \
            "${assets}/semantic/semantic-query-report.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/semantic-query-cost.json" \
            "${assets}/semantic/semantic-query-cost.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/machine-review-consensus.json" \
            "${assets}/semantic/machine-review-consensus.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/owner-review-packet.en.json" \
            "${assets}/semantic/owner-review-packet.en.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence/owner-review-packet.zh-CN.json" \
            "${assets}/semantic/owner-review-packet.zh-CN.json"
          cp "${RUNNER_TEMP}/semantic-release-evidence"/machine-reviews/*.json \
            "${assets}/semantic/machine-reviews/"
          (
            cd adapters/obsidian/plugin
            npm ci
            npm test
            npm run check
            npm run build
            npm run bundle:verify
          )
          python - "${assets}/editors/deeplaw-obsidian-plugin.zip" <<'PY'
          import pathlib
          import sys
          import zipfile

          root = pathlib.Path("adapters/obsidian/plugin")
          output = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in ("main.js", "manifest.json", "styles.css"):
                  path = root / name
                  if not path.is_file():
                      raise SystemExit(f"missing Obsidian artifact member: {name}")
                  info = zipfile.ZipInfo(name, date_time=(2000, 1, 1, 0, 0, 0))
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          uv run --frozen python adapters/tolaria/integration_harness.py \
            > "${assets}/editors/tolaria-integration-report.json"
          cp "docs/RELEASE_NOTES_v${version}.md" \
            "${assets}/documentation/RELEASE_NOTES_v${version}.md"
          major_minor=$(python - "${version}" <<'PY'
          import sys

          major, minor, _patch = sys.argv[1].split(".")
          print(f"V{major}_{minor}")
          PY
          )
          cp "docs/${major_minor}_ACCEPTANCE_MATRIX.md" \
            "${assets}/documentation/${major_minor}_ACCEPTANCE_MATRIX.md"
          for profile in default build discovery document-engine; do
            uv run --frozen python -m benchmarks.release.audit_dependencies \
              --profile "${profile}" \
              --output "${assets}/security/audit-${profile}.json"
          done
          uv export --quiet --frozen --all-extras --no-extra dev --no-dev \
            --format cyclonedx1.5 \
            --output-file "${assets}/sbom/deeplaw-${version}.cdx.json"
          uv run --frozen python -m benchmarks.release.inventory_licenses \
            --output "${assets}/licenses/deeplaw-${version}-licenses.json"
          cp security/openvex.json "${assets}/security/openvex.json"
          uv run --frozen python -m benchmarks.release.commercial_release \
            --assets-root "${assets}" \
            --platform "${assets}/evidence/platform-linux-py311.json" \
            --platform "${assets}/evidence/platform-linux-py312.json" \
            --platform "${assets}/evidence/platform-linux-py313.json" \
            --platform "${assets}/evidence/platform-darwin-py311.json" \
            --platform "${assets}/evidence/platform-darwin-py312.json" \
            --platform "${assets}/evidence/platform-darwin-py313.json" \
            --platform "${assets}/evidence/platform-windows-py311.json" \
            --platform "${assets}/evidence/platform-windows-py312.json" \
            --platform "${assets}/evidence/platform-windows-py313.json" \
            --host "${assets}/evidence/no-model-host-acceptance.json" \
            --reproducible "${assets}/evidence/reproducible-build.json" \
            --oci-report "${assets}/evidence/oci-release-report.json" \
            --audit "${assets}/security/audit-default.json" \
            --audit "${assets}/security/audit-build.json" \
            --audit "${assets}/security/audit-discovery.json" \
            --audit "${assets}/security/audit-document-engine.json" \
            --sbom "${assets}/sbom/deeplaw-${version}.cdx.json" \
            --licenses "${assets}/licenses/deeplaw-${version}-licenses.json" \
            --openvex "${assets}/security/openvex.json" \
            --evaluation \
              "${RUNNER_TEMP}/gate-evidence/evaluation-protocol/evaluation-report.json" \
            --living-wiki-quality \
              "${assets}/quality/living-wiki-quality-report.json" \
            --living-wiki-baseline \
              "${assets}/quality/living-wiki-quality-baseline.json" \
            --living-wiki-comparison \
              "${assets}/quality/living-wiki-quality-comparison.json" \
            --source-quality-matrix \
              "${assets}/quality/v0.12-28-source-decision-matrix.json" \
            --semantic-gold "${assets}/semantic/semantic-gold.json" \
            --semantic-lifecycle \
              "${assets}/semantic/deterministic-semantic-lifecycle.json" \
            --semantic-query "${assets}/semantic/semantic-query-report.json" \
            --semantic-query-cost "${assets}/semantic/semantic-query-cost.json" \
            --semantic-consensus "${assets}/semantic/machine-review-consensus.json" \
            --semantic-machine-review \
              "${assets}/semantic/machine-reviews/semantic_gold_formal_auditor.json" \
            --semantic-machine-review \
              "${assets}/semantic/machine-reviews/claim_entailment_auditor.json" \
            --semantic-machine-review \
              "${assets}/semantic/machine-reviews/retrieval_completeness_auditor.json" \
            --semantic-machine-review \
              "${assets}/semantic/machine-reviews/chinese_adversarial_auditor.json" \
            --semantic-machine-review \
              "${assets}/semantic/machine-reviews/authority_security_auditor.json" \
            --semantic-machine-review \
              "${assets}/semantic/machine-reviews/reproducibility_release_auditor.json" \
            --semantic-owner-review-english \
              "${assets}/semantic/owner-review-packet.en.json" \
            --semantic-owner-review-chinese \
              "${assets}/semantic/owner-review-packet.zh-CN.json" \
            --authoritative-evidence-quality \
              "${assets}/quality/authoritative-evidence-quality.json" \
            --obsidian-artifact "${assets}/editors/deeplaw-obsidian-plugin.zip" \
            --tolaria-report "${assets}/editors/tolaria-integration-report.json" \
            --output "${assets}/commercial-release-manifest.json"
          uv run --frozen python -m benchmarks.release.write_checksums \
            --assets-root "${assets}" \
            --output "${assets}/SHA256SUMS"
          git diff --check

      - name: Upload exact commercial release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-release-assets
          if-no-files-found: error
          path: ${{ runner.temp }}/release-assets/
