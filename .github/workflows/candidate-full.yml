name: Candidate Full

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

permissions:
  contents: read

concurrency:
  group: candidate-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-artifact:
    name: Freeze the single verified wheel and sdist
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'candidate-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify frozen source prerequisites
        run: |
          uv lock --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          uv sync --frozen --extra dev

      - name: Build twice and retain only the byte-identical artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct HEAD)
          uv run --frozen python -m benchmarks.release.verify_reproducible_build \
            --source-date-epoch "${source_date_epoch}" \
            --artifact-dir "${RUNNER_TEMP}/verified-dist" \
            --output "${RUNNER_TEMP}/verified-dist/reproducible-build.json"
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --dist "${RUNNER_TEMP}/verified-dist" \
            --output "${RUNNER_TEMP}/verified-dist/retained-artifact-manifest.json"
          uv run --frozen python -m benchmarks.release.freeze_qualification_candidate_v3 \
            --template benchmarks/v013/active-qualification-v3.json \
            --reproducible-report "${RUNNER_TEMP}/verified-dist/reproducible-build.json" \
            --artifact-manifest "${RUNNER_TEMP}/verified-dist/retained-artifact-manifest.json" \
            --output "${RUNNER_TEMP}/verified-dist/frozen-active-qualification.json"
          test -f "${RUNNER_TEMP}/verified-dist/frozen-active-qualification.json"
          test ! -L "${RUNNER_TEMP}/verified-dist/frozen-active-qualification.json"

      - name: Export hash-pinned runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$(mktemp -d "${RUNNER_TEMP}/candidate-requirements-export.XXXXXX")"
          destination="${RUNNER_TEMP}/verified-dist/candidate-requirements.txt"
          test ! -e "${destination}"
          test ! -L "${destination}"
          (
            cd "${export_dir}"
            UV_PROJECT="${GITHUB_WORKSPACE}" \
              uv export --frozen --no-dev --no-emit-project --no-emit-local \
              --output-file candidate-requirements.txt
          )
          source="${export_dir}/candidate-requirements.txt"
          test -f "${source}"
          test ! -L "${source}"
          mv "${source}" "${destination}"
          rmdir "${export_dir}"

      - name: Derive closed pre-publish supply-chain evidence from the verified bytes
        shell: bash
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/verified-dist"
          wheel=$(find "${dist}" -maxdepth 1 -type f -name '*.whl')
          test -n "${wheel}"
          supply_venv="${RUNNER_TEMP}/supply-chain-venv"
          uv venv "${supply_venv}" --python "3.12" --seed
          uv pip install --python "${supply_venv}/bin/python" \
            --require-hashes \
            --requirements "${dist}/candidate-requirements.txt"
          uv pip install --python "${supply_venv}/bin/python" --no-deps "${wheel}"
          "${supply_venv}/bin/python" -m benchmarks.release.inventory_licenses \
            --output "${dist}/installed-licenses.json"
          uv export --quiet --frozen --all-extras --no-extra dev --no-dev \
            --format cyclonedx1.5 \
            --output-file "${dist}/deeplaw.cdx.json"
          cp security/openvex.json "${dist}/openvex.json"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          uv run --frozen python -m benchmarks.release.pre_publish_artifact_gate \
            --artifact-root "${dist}" \
            --reproducible-report "${dist}/reproducible-build.json" \
            --retained-manifest "${dist}/retained-artifact-manifest.json" \
            --sbom "${dist}/deeplaw.cdx.json" \
            --openvex "${dist}/openvex.json" \
            --licenses "${dist}/installed-licenses.json" \
            --created-at-epoch "${source_date_epoch}" \
            --output "${dist}/pre-publish-artifact-gate.json"

      - name: Retain the one verified artifact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-candidate-artifacts
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/verified-dist/

  exact-wheel:
    name: Execute exact verified wheel public journey
    needs: verified-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install verifier runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install verifier dependencies
        run: uv sync --frozen --extra dev

      - name: Download the exact verified candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          path: ${{ runner.temp }}/verified-dist

      - name: Execute the installed wheel and real public journey
        shell: bash
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/verified-dist"
          manifest="${dist}/retained-artifact-manifest.json"
          requirements="${dist}/candidate-requirements.txt"
          receipt="${RUNNER_TEMP}/exact-wheel-execution.json"
          venv="${RUNNER_TEMP}/exact-wheel-venv"
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . \
            --dist "${dist}" \
            --output "${manifest}" \
            --verify
          test "$(find "${dist}" -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 1
          test -s "${requirements}"
          expected_wheel_sha256="$(uv run --frozen python -c \
            'import json, pathlib, sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["wheel"]["sha256"])' \
            "${manifest}")"
          expected_version="$(uv run --frozen python -c \
            'import json, pathlib, sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["package_version"])' \
            "${manifest}")"
          expected_requirements_sha256="$(sha256sum "${requirements}" | cut -d ' ' -f 1)"
          uv run --frozen python -m benchmarks.release.exact_wheel_runner \
            --candidate-dir "${dist}" \
            --expected-wheel-sha256 "${expected_wheel_sha256}" \
            --requirements-filename "candidate-requirements.txt" \
            --expected-requirements-sha256 "${expected_requirements_sha256}" \
            --expected-version "${expected_version}" \
            --repository "${GITHUB_WORKSPACE}" \
            --venv "${venv}" \
            --receipt-contract candidate-full-v1 \
            --receipt "${receipt}"

      - name: Retain exact wheel execution receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-wheel-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/exact-wheel-execution.json

  scale_ten_thousand:
    name: Execute exact verified wheel at the 10k supported boundary
    needs: verified-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact candidate scale runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install closed scale runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Download the exact verified candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          path: ${{ runner.temp }}/verified-dist

      - name: Execute the public 10k qualification path once
        shell: bash
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/verified-dist"
          manifest="${dist}/retained-artifact-manifest.json"
          requirements="${dist}/candidate-requirements.txt"
          output="${RUNNER_TEMP}/scale-10000/v013-scale-qualification-v9.json"
          venv="${RUNNER_TEMP}/scale-10000-venv"
          uv lock --check
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . --dist "${dist}" --output "${manifest}" --verify
          test -s "${requirements}"
          test "$(find "${dist}" -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find "${dist}" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          wheel="$(find "${dist}" -maxdepth 1 -type f -name '*.whl')"
          sdist="$(find "${dist}" -maxdepth 1 -type f -name '*.tar.gz')"
          wheel_sha256="$(sha256sum "${wheel}" | cut -d ' ' -f 1)"
          sdist_sha256="$(sha256sum "${sdist}" | cut -d ' ' -f 1)"
          lock_sha256="$(sha256sum uv.lock | cut -d ' ' -f 1)"
          candidate_commit="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          candidate_version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          mkdir "${RUNNER_TEMP}/scale-10000"
          uv venv "${venv}" --python "3.12" --seed
          uv pip install --python "${venv}/bin/python" \
            --require-hashes --requirements "${requirements}"
          uv pip install --python "${venv}/bin/python" --no-deps "${wheel}"
          "${venv}/bin/python" -m benchmarks.v013.scale_qualification_v9 \
            --execute-10k \
            --wheel "${wheel}" \
            --sdist "${sdist}" \
            --lock-sha256 "${lock_sha256}" \
            --candidate-commit "${candidate_commit}" \
            --candidate-tree "${candidate_tree}" \
            --candidate-version "${candidate_version}" \
            --candidate-wheel-sha256 "${wheel_sha256}" \
            --candidate-sdist-sha256 "${sdist_sha256}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --output "${output}"

      - name: Retain exact 10k scale evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-10000-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/scale-10000/v013-scale-qualification-v9.json

  semantic_scale_ten_thousand:
    name: Enforce semantic 10k scale gate
    needs: scale_ten_thousand
    if: ${{ needs.scale_ten_thousand.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact 10k scale evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scale-10000-evidence
          path: ${{ runner.temp }}/scale-10000-evidence

      - name: Enforce semantic 10k release gate
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/scale-10000-evidence
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          EXPECTED_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_workflow_run_id = os.environ.get("EXPECTED_WORKFLOW_RUN_ID", "")
          if not re.fullmatch(r"[1-9][0-9]*", expected_workflow_run_id):
              raise SystemExit("semantic 10k gate: expected workflow run id invalid")
          expected_candidate_head_sha = os.environ.get("EXPECTED_CANDIDATE_HEAD_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected_candidate_head_sha):
              raise SystemExit("semantic 10k gate: expected candidate head invalid")

          root = Path(os.environ["EVIDENCE_ROOT"])
          evidence = tuple(root.rglob("v013-scale-qualification-v9.json"))
          if len(evidence) != 1:
              raise SystemExit("semantic 10k gate: evidence cardinality invalid")
          try:
              with evidence[0].open("r", encoding="utf-8") as stream:
                  report = json.load(stream)
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(
                  "semantic 10k gate: evidence unreadable "
                  f"({type(error).__name__})"
              ) from None
          if not isinstance(report, dict):
              raise SystemExit("semantic 10k gate: report shape invalid")
          run_binding = report.get("run_binding")
          if not isinstance(run_binding, dict):
              raise SystemExit("semantic 10k gate: run binding shape invalid")
          workflow_run_id = run_binding.get("workflow_run_id")
          if type(workflow_run_id) is not int or workflow_run_id <= 0:
              raise SystemExit("semantic 10k gate: workflow run id invalid")
          if workflow_run_id != int(expected_workflow_run_id):
              raise SystemExit("semantic 10k gate: workflow run id mismatch")
          candidate_binding = report.get("candidate_binding")
          if not isinstance(candidate_binding, dict):
              raise SystemExit("semantic 10k gate: candidate binding shape invalid")
          if candidate_binding.get("commit") != expected_candidate_head_sha:
              raise SystemExit("semantic 10k gate: candidate head mismatch")
          if report.get("schema_version") != "deeplaw.v013-scale-qualification-report/v9":
              raise SystemExit("semantic 10k gate: schema version mismatch")
          if report.get("status") != "executed":
              raise SystemExit("semantic 10k gate: execution status is not executed")
          if report.get("release_gate_passed") is not True:
              raise SystemExit("semantic 10k gate: release gate is not passed")
          if report.get("hard_failures") != []:
              raise SystemExit("semantic 10k gate: hard failures are present")
          PY

  windows-calibration-shards:
    name: Calibrate Windows Python 3.12 shard ${{ matrix.shard }} of 3
    needs: verified-artifact
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra discovery

      - name: Download and verify the exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          path: ${{ runner.temp }}/inputs/verified-candidate-artifacts

      - name: Select deterministic unweighted calibration shard
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m benchmarks.release.candidate_regression \
            select \
            --shard-count 3 \
            --shard-index "${{ matrix.shard }}" \
            --output "${RUNNER_TEMP}/candidate-test-shard.json" \
            --paths-output "${RUNNER_TEMP}/candidate-test-files.txt"

      - name: Execute duration calibration shard
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          mapfile -t test_files < "${RUNNER_TEMP}/candidate-test-files.txt"
          uv run --frozen pytest --strict-markers \
            -m "not qualification" \
            --junitxml="${RUNNER_TEMP}/candidate-tests.xml" \
            "${test_files[@]}"
          uv run --frozen python -m benchmarks.release.candidate_artifact_path_policy \
            normalize-junit \
            --input "${RUNNER_TEMP}/candidate-tests.xml" \
            --output "${RUNNER_TEMP}/candidate-tests.xml" \
            --checkout-root "${GITHUB_WORKSPACE}"
          uv run --frozen python -m benchmarks.release.candidate_regression \
            receipt \
            --junit "${RUNNER_TEMP}/candidate-tests.xml" \
            --output "${RUNNER_TEMP}/candidate-skip-receipt.json" \
            --matrix-os windows-latest \
            --matrix-python "3.12" \
            --shard-manifest "${RUNNER_TEMP}/candidate-test-shard.json"

      - name: Fresh-install the exact Windows Python 3.12 artifact
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/inputs/verified-candidate-artifacts"
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . --dist "${dist}" \
            --output "${dist}/retained-artifact-manifest.json" --verify
          wheel=$(find "${dist}" -maxdepth 1 -type f -name '*.whl')
          uv venv "${RUNNER_TEMP}/fresh" --python "3.12" --seed
          uv pip install --python "${RUNNER_TEMP}/fresh/Scripts/python.exe" "${wheel}"
          "${RUNNER_TEMP}/fresh/Scripts/deeplaw.exe" --version

      - name: Retain exact duration calibration shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-calibration-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/candidate-tests.xml
            ${{ runner.temp }}/candidate-test-shard.json
            ${{ runner.temp }}/candidate-skip-receipt.json

  windows-calibration:
    name: Aggregate exact Windows Python 3.12 duration calibration
    needs: windows-calibration-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact calibration shard receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-calibration-shard-*
          path: ${{ runner.temp }}/windows-calibration-shards

      - name: Aggregate complete disjoint calibration and freeze actual weights
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmarks.release.candidate_regression \
            aggregate \
            --input-directory "${RUNNER_TEMP}/windows-calibration-shards" \
            --matrix-python "3.12" \
            --output "${RUNNER_TEMP}/windows-calibration-aggregate.json" \
            --junit-output "${RUNNER_TEMP}/windows-calibration.xml"
          python -m benchmarks.release.candidate_artifact_path_policy \
            normalize-junit \
            --input "${RUNNER_TEMP}/windows-calibration.xml" \
            --output "${RUNNER_TEMP}/windows-calibration.xml" \
            --checkout-root "${GITHUB_WORKSPACE}"
          python -m benchmarks.release.candidate_regression \
            weights \
            --junit "${RUNNER_TEMP}/windows-calibration.xml" \
            --output "${RUNNER_TEMP}/windows-duration-weights.json"

      - name: Retain exact duration calibration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-duration-calibration
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/windows-calibration.xml
            ${{ runner.temp }}/windows-calibration-aggregate.json
            ${{ runner.temp }}/windows-duration-weights.json

  posix-matrix:
    name: Full ${{ matrix.os }} Python ${{ matrix.python-version }}
    needs: verified-artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download the exact verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          path: ${{ runner.temp }}/verified-dist

      - name: Verify identity, execute full current-source suite, and fresh-install exact wheel
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra discovery
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . \
            --dist "${RUNNER_TEMP}/verified-dist" \
            --output "${RUNNER_TEMP}/verified-dist/retained-artifact-manifest.json" \
            --verify
          uv run --frozen pytest --strict-markers \
            -m "not qualification and not windows_native" \
            --junitxml="${RUNNER_TEMP}/candidate-tests.xml"
          uv run --frozen python -m benchmarks.release.candidate_artifact_path_policy \
            normalize-junit \
            --input "${RUNNER_TEMP}/candidate-tests.xml" \
            --output "${RUNNER_TEMP}/candidate-tests.xml" \
            --checkout-root "${GITHUB_WORKSPACE}"
          wheel=$(find "${RUNNER_TEMP}/verified-dist" -maxdepth 1 -type f -name '*.whl')
          test "$(printf '%s\n' "${wheel}" | wc -l | tr -d ' ')" = 1
          uv venv "${RUNNER_TEMP}/fresh" --python "${{ matrix.python-version }}" --seed
          uv pip install --python "${RUNNER_TEMP}/fresh/bin/python" "${wheel}"
          "${RUNNER_TEMP}/fresh/bin/deeplaw" --version

      - name: Retain matrix JUnit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-full-${{ matrix.os }}-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/candidate-tests.xml

  windows-shards:
    name: Full Windows Python ${{ matrix.python-version }} duration shard ${{ matrix.shard }} of 3
    needs:
      - verified-artifact
      - windows-calibration
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
        shard:
          - 1
          - 2
          - 3
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download the exact verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          path: ${{ runner.temp }}/inputs/verified-candidate-artifacts

      - name: Download the deterministic duration weights
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-duration-calibration
          path: ${{ runner.temp }}/inputs/windows-duration-calibration

      - name: Select deterministic duration-weighted shard
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra discovery
          uv run --frozen python -m benchmarks.release.candidate_regression \
            select \
            --duration-weights "${RUNNER_TEMP}/inputs/windows-duration-calibration/windows-duration-weights.json" \
            --shard-count 3 \
            --shard-index "${{ matrix.shard }}" \
            --output "${RUNNER_TEMP}/candidate-test-shard.json" \
            --paths-output "${RUNNER_TEMP}/candidate-test-files.txt"

      - name: Execute exact Windows shard
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          mapfile -t test_files < "${RUNNER_TEMP}/candidate-test-files.txt"
          uv run --frozen pytest --strict-markers \
            --maxfail=1 \
            -m "not qualification" \
            --junitxml="${RUNNER_TEMP}/candidate-tests.xml" \
            "${test_files[@]}"
          uv run --frozen python -m benchmarks.release.candidate_artifact_path_policy \
            normalize-junit \
            --input "${RUNNER_TEMP}/candidate-tests.xml" \
            --output "${RUNNER_TEMP}/candidate-tests.xml" \
            --checkout-root "${GITHUB_WORKSPACE}"
          uv run --frozen python -m benchmarks.release.candidate_regression \
            receipt \
            --junit "${RUNNER_TEMP}/candidate-tests.xml" \
            --output "${RUNNER_TEMP}/candidate-skip-receipt.json" \
            --matrix-os windows-latest \
            --matrix-python "${{ matrix.python-version }}" \
            --shard-manifest "${RUNNER_TEMP}/candidate-test-shard.json"

      - name: Verify and fresh-install the exact artifact once per Python
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/inputs/verified-candidate-artifacts"
          uv run --frozen python -m benchmarks.release.retained_artifact_manifest \
            --repository . --dist "${dist}" \
            --output "${dist}/retained-artifact-manifest.json" --verify
          wheel=$(find "${dist}" -maxdepth 1 -type f -name '*.whl')
          uv venv "${RUNNER_TEMP}/fresh" --python "${{ matrix.python-version }}" --seed
          uv pip install --python "${RUNNER_TEMP}/fresh/Scripts/python.exe" "${wheel}"
          "${RUNNER_TEMP}/fresh/Scripts/deeplaw.exe" --version

      - name: Retain exact Windows shard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-full-windows-${{ matrix.python-version }}-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/candidate-tests.xml
            ${{ runner.temp }}/candidate-test-shard.json
            ${{ runner.temp }}/candidate-skip-receipt.json

  windows-aggregate:
    name: Verify complete disjoint Windows Python ${{ matrix.python-version }} coverage
    needs: windows-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact shard receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-full-windows-${{ matrix.python-version }}-*
          path: ${{ runner.temp }}/windows-shards

      - name: Aggregate and rebuild shard coverage
        run: >-
          python -m benchmarks.release.candidate_regression
          aggregate
          --input-directory "${{ runner.temp }}/windows-shards"
          --matrix-python "${{ matrix.python-version }}"
          --output "${{ runner.temp }}/windows-aggregate.json"
          --junit-output "${{ runner.temp }}/candidate-tests.xml"

      - name: Normalize aggregate JUnit before upload
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmarks.release.candidate_artifact_path_policy \
            normalize-junit \
            --input "${RUNNER_TEMP}/candidate-tests.xml" \
            --output "${RUNNER_TEMP}/candidate-tests.xml" \
            --checkout-root "${GITHUB_WORKSPACE}"

      - name: Retain aggregate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-full-windows-${{ matrix.python-version }}-aggregate
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/windows-aggregate.json
            ${{ runner.temp }}/candidate-tests.xml

  aggregate-raw-evidence:
    name: Aggregate Candidate Full raw evidence
    needs:
      - verified-artifact
      - exact-wheel
      - scale_ten_thousand
      - windows-calibration
      - posix-matrix
      - windows-shards
      - windows-aggregate
    if: ${{ always() && needs['verified-artifact'].result == 'success' && needs['exact-wheel'].result == 'success' && needs['scale_ten_thousand'].result == 'success' && needs['windows-calibration'].result == 'success' && needs['posix-matrix'].result == 'success' && needs['windows-shards'].result == 'success' && needs['windows-aggregate'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact Candidate Full evidence definitions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the verified candidate artifacts without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          path: ${{ runner.temp }}/candidate-full-raw-evidence/verified-candidate-artifacts

      - name: Download the exact wheel execution receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exact-wheel-evidence
          path: ${{ runner.temp }}/candidate-full-raw-evidence/exact-wheel-evidence

      - name: Download the exact 10k scale receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scale-10000-evidence
          path: ${{ runner.temp }}/candidate-full-raw-evidence/scale-10000-evidence

      - name: Download every raw platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-full-*
          path: ${{ runner.temp }}/candidate-full-raw-evidence/platform-artifacts
          merge-multiple: false

      - name: Download raw Windows calibration artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-duration-calibration
          path: ${{ runner.temp }}/candidate-full-raw-evidence/windows-duration-calibration

      - name: Verify all raw evidence inputs are present
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/candidate-full-raw-evidence"
          verified="${raw}/verified-candidate-artifacts"
          mkdir "${raw}/candidate-platform"
          cp benchmarks/release/platform-core-test-manifest-v2.json \
            "${raw}/candidate-platform/platform-core-test-manifest-v2.json"
          python -m benchmarks.release.candidate_regression platform \
            --active-qualification "${verified}/frozen-active-qualification.json" \
            --platform-artifacts "${raw}/platform-artifacts" \
            --windows-calibration "${raw}/windows-duration-calibration" \
            --candidate-run-id "${GITHUB_RUN_ID}" \
            --output "${raw}/candidate-platform/platform-matrix-receipt.json"
          test "$(find "${verified}" -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find "${verified}" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          for required in \
            reproducible-build.json \
            retained-artifact-manifest.json \
            frozen-active-qualification.json \
            candidate-requirements.txt \
            pre-publish-artifact-gate.json \
            deeplaw.cdx.json \
            openvex.json \
            installed-licenses.json; do
            test -s "${verified}/${required}"
          done
          test -s "${raw}/exact-wheel-evidence/exact-wheel-execution.json"
          test -s "${raw}/scale-10000-evidence/v013-scale-qualification-v9.json"
          test "$(find "${raw}/platform-artifacts" -type f -name 'candidate-tests.xml' | wc -l | tr -d ' ')" = 14
          test "$(find "${raw}/windows-duration-calibration" -type f -name 'windows-calibration.xml' | wc -l | tr -d ' ')" = 1
          test "$(find "${raw}/platform-artifacts" -type f -name 'windows-aggregate.json' | wc -l | tr -d ' ')" = 2
          test -s "${raw}/candidate-platform/platform-core-test-manifest-v2.json"
          test -s "${raw}/candidate-platform/platform-matrix-receipt.json"

      - name: Write path-independent Candidate Full run receipt
        shell: bash
        env:
          RAW_ROOT: ${{ runner.temp }}/candidate-full-raw-evidence
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RAW_ROOT"])
          receipt = {
              "schema_version": "deeplaw.candidate-full-run-receipt/v1",
              "record_kind": "candidate_full_raw_evidence",
              "workflow": "Candidate Full",
              "workflow_path": ".github/workflows/candidate-full.yml",
              "run_id": int(os.environ["CANDIDATE_RUN_ID"]),
              "run_attempt": int(os.environ["CANDIDATE_RUN_ATTEMPT"]),
              "head_sha": os.environ["CANDIDATE_HEAD_SHA"],
              "event": os.environ["CANDIDATE_EVENT"],
              "retention_days": 90,
              "path_policy": "logical_relative_paths_only",
          }
          (root / "candidate-full-run-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate retained Candidate Full text and XML before inventory upload
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmarks.release.candidate_artifact_path_policy \
            validate \
            --root "${RUNNER_TEMP}/candidate-full-raw-evidence" \
            --requirements "${RUNNER_TEMP}/candidate-full-raw-evidence/verified-candidate-artifacts/candidate-requirements.txt"

      - name: Write path-independent raw evidence inventory receipt
        shell: bash
        env:
          RAW_ROOT: ${{ runner.temp }}/candidate-full-raw-evidence
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RAW_ROOT"])
          inventory_name = "candidate-full-inventory-receipt.json"
          files = []
          for path in sorted(root.rglob("*")):
              if path.name == inventory_name:
                  continue
              if path.is_symlink():
                  raise SystemExit(f"raw evidence contains a symlink: {path.name}")
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append(
                  {
                      "logical_path": path.relative_to(root).as_posix(),
                      "sha256": digest.hexdigest(),
                      "bytes": path.stat().st_size,
                  }
              )
          receipt = {
              "schema_version": "deeplaw.candidate-full-inventory-receipt/v1",
              "record_kind": "candidate_full_raw_inventory",
              "run_id": int(os.environ["CANDIDATE_RUN_ID"]),
              "head_sha": os.environ["CANDIDATE_HEAD_SHA"],
              "path_policy": "logical_relative_paths_only",
              "files": files,
          }
          (root / inventory_name).write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain Candidate Full raw evidence for 90 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-full-raw-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/candidate-full-raw-evidence/
