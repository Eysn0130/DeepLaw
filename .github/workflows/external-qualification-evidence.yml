          test -s scorer-b-output/result/process.json
          cp scorer-inputs/candidate-sanitized-output/frozen-active-qualification.json \
            scorer-b-output/result/frozen-active-qualification.json
          test -s scorer-b-output/result/frozen-active-qualification.json
          "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" \
