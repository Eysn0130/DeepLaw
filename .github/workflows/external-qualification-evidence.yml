name: External Qualification Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate Full run for this exact commit.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: external-qualification-${{ github.sha }}
  cancel-in-progress: false

# Every job is a separate OS security domain.  Role-specific labels are only
# scheduling constraints: each job must obtain an OS/runner attestation from
# DEEPLAW_SECURITY_DOMAIN_ATTESTER.  A label, a minimal process environment, or
# a caller boolean is not isolation evidence.
jobs:
  candidate:
    name: Candidate Host domain (exact downloaded artifact)
    runs-on: [self-hosted, macOS, deeplaw-qualification-candidate]
    timeout-minutes: 360
    env:
      CANDIDATE_INPUT_ROOT: ${{ runner.temp }}/candidate-inputs
      DIST_ROOT: ${{ runner.temp }}/candidate-dist
      EXACT_WHEEL_RECEIPT: ${{ runner.temp }}/exact-wheel-receipt.json
      EXACT_WHEEL_VENV: ${{ runner.temp }}/exact-wheel-venv
    steps:
      - name: Check out the exact requested candidate verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the successful Candidate Full run and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]]
          test "${CANDIDATE_RUN_ID}" != "${GITHUB_RUN_ID}"
          candidate_api="repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}"
          test "$(gh api "${candidate_api}" --jq .status)" = completed
          test "$(gh api "${candidate_api}" --jq .conclusion)" = success
          test "$(gh api "${candidate_api}" --jq .head_sha)" = "${GITHUB_SHA}"
          test "$(gh api "${candidate_api}" --jq .name)" = "Candidate Full"
          test "$(gh api "${candidate_api}" --jq .path)" = ".github/workflows/candidate-full.yml"

      - name: Download the sole verified candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-artifacts
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-inputs/verified-candidate-artifacts

      - name: Download Candidate Full raw evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-full-raw-evidence
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-inputs/candidate-full-raw-evidence

      - name: Verify Candidate Full artifact and raw-evidence closure
        env:
          CANDIDATE_HEAD_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts"
          test -d "${CANDIDATE_INPUT_ROOT}/candidate-full-raw-evidence"
          test ! -e "${CANDIDATE_INPUT_ROOT}/.env"
          test ! -e "${CANDIDATE_INPUT_ROOT}/auth.json"
          test ! -e "${CANDIDATE_INPUT_ROOT}/transcript"
          test ! -e "${CANDIDATE_INPUT_ROOT}/reasoning"
          test ! -e "${CANDIDATE_INPUT_ROOT}/raw-events"
          python -m benchmarks.release.retained_artifact_manifest \
            --repository "${GITHUB_WORKSPACE}" \
            --dist "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts" \
            --output "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts/retained-artifact-manifest.json" \
            --verify
          CANDIDATE_HEAD_SHA="${CANDIDATE_HEAD_SHA}" CANDIDATE_RUN_ID="${CANDIDATE_RUN_ID}" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          verified = Path(os.environ["CANDIDATE_INPUT_ROOT"]) / "verified-candidate-artifacts"
          raw_root = Path(os.environ["CANDIDATE_INPUT_ROOT"]) / "candidate-full-raw-evidence"
          candidate_sha = os.environ["CANDIDATE_HEAD_SHA"]
          candidate_run_id = int(os.environ["CANDIDATE_RUN_ID"])

          def read_json(path: Path) -> dict:
              data = path.read_bytes()
              value = json.loads(data.decode("utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit("Candidate Full receipt is not an object")
              return value

          run_receipt = read_json(raw_root / "candidate-full-run-receipt.json")
          if run_receipt != {
              "schema_version": "deeplaw.candidate-full-run-receipt/v1",
              "record_kind": "candidate_full_raw_evidence",
              "workflow": "Candidate Full",
              "workflow_path": ".github/workflows/candidate-full.yml",
              "run_id": candidate_run_id,
              "run_attempt": run_receipt.get("run_attempt"),
              "head_sha": candidate_sha,
              "event": run_receipt.get("event"),
              "retention_days": 90,
              "path_policy": "logical_relative_paths_only",
          } or not isinstance(run_receipt["run_attempt"], int) or run_receipt["run_attempt"] < 1 \
                  or run_receipt["event"] not in {"workflow_dispatch", "pull_request"}:
              raise SystemExit("Candidate Full run receipt identity differs")

          inventory_path = raw_root / "candidate-full-inventory-receipt.json"
          inventory_bytes = inventory_path.read_bytes()
          inventory = json.loads(inventory_bytes.decode("utf-8"))
          if not isinstance(inventory, dict) or set(inventory) != {
              "schema_version", "record_kind", "run_id", "head_sha", "path_policy", "files"
          } or inventory.get("schema_version") != "deeplaw.candidate-full-inventory-receipt/v1" \
                  or inventory.get("record_kind") != "candidate_full_raw_inventory" \
                  or inventory.get("run_id") != candidate_run_id \
                  or inventory.get("head_sha") != candidate_sha \
                  or inventory.get("path_policy") != "logical_relative_paths_only":
              raise SystemExit("Candidate Full raw inventory identity differs")
          declared = {}
          for row in inventory["files"]:
              if not isinstance(row, dict) or set(row) != {"logical_path", "sha256", "bytes"}:
                  raise SystemExit("Candidate Full raw inventory row is not closed")
              logical = row["logical_path"]
              if not isinstance(logical, str) or not logical or logical.startswith("/") \
                      or "\\" in logical or logical in declared or any(part in {"", ".", ".."} for part in logical.split("/")):
                  raise SystemExit("Candidate Full raw inventory path is invalid")
              if not isinstance(row["sha256"], str) or len(row["sha256"]) != 64 \
                      or any(char not in "0123456789abcdef" for char in row["sha256"]):
                  raise SystemExit("Candidate Full raw inventory digest is invalid")
              if not isinstance(row["bytes"], int) or isinstance(row["bytes"], bool) or row["bytes"] < 1:
                  raise SystemExit("Candidate Full raw inventory byte size is invalid")
              declared[logical] = (row["sha256"], row["bytes"])
          observed = {}
          for path in sorted(raw_root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("Candidate Full raw evidence contains a symlink")
              if not path.is_file() or path == inventory_path:
                  continue
              data = path.read_bytes()
              observed[path.relative_to(raw_root).as_posix()] = (
                  hashlib.sha256(data).hexdigest(), len(data)
              )
          if observed != declared:
              raise SystemExit("Candidate Full raw inventory does not match retained bytes")
          print("Candidate Full manifest and raw inventory verified")
          PY

      - name: Install the checkout verifier runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Execute the exact downloaded wheel in a repository-external venv
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DIST_ROOT: ${{ runner.temp }}/candidate-dist
          EXACT_WHEEL_RECEIPT: ${{ runner.temp }}/exact-wheel-receipt.json
          EXACT_WHEEL_VENV: ${{ runner.temp }}/exact-wheel-venv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DIST_ROOT}"
          cp "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts/"* "${DIST_ROOT}/"
          expected_wheel_sha256="$(python -c 'import json, pathlib, os; print(json.loads((pathlib.Path(os.environ["DIST_ROOT"]) / "retained-artifact-manifest.json").read_text(encoding="utf-8"))["wheel"]["sha256"])')"
          expected_version="$(python -c 'import json, pathlib, os; print(json.loads((pathlib.Path(os.environ["DIST_ROOT"]) / "retained-artifact-manifest.json").read_text(encoding="utf-8"))["package_version"])')"
          uv run --frozen python -m benchmarks.release.exact_wheel_runner \
            --candidate-dir "${DIST_ROOT}" \
            --expected-wheel-sha256 "${expected_wheel_sha256}" \
            --requirements-filename candidate-requirements.txt \
            --expected-requirements-sha256 "$(shasum -a 256 "${DIST_ROOT}/candidate-requirements.txt" | cut -d ' ' -f 1)" \
            --expected-version "${expected_version}" \
            --repository "${GITHUB_WORKSPACE}" \
            --venv "${EXACT_WHEEL_VENV}" \
            --receipt-contract external-qualification-v2 \
            --candidate-commit "${GITHUB_SHA}" \
            --candidate-tree "$(git rev-parse HEAD^{tree})" \
            --expected-lock-sha256 "$(shasum -a 256 uv.lock | cut -d ' ' -f 1)" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --evidence-run-id "${GITHUB_RUN_ID}" \
            --corpus-sha256 "$(shasum -a 256 "${CANDIDATE_INPUT_ROOT}/candidate-full-raw-evidence/candidate-full-inventory-receipt.json" | cut -d ' ' -f 1)" \
            --receipt "${EXACT_WHEEL_RECEIPT}"
          test -s "${EXACT_WHEEL_RECEIPT}"
          test ! -L "${EXACT_WHEEL_RECEIPT}"

      - name: Execute exact Host runs through the candidate-only credential broker
        env:
          DIST_ROOT: ${{ runner.temp }}/candidate-dist
          EXACT_WHEEL_RECEIPT: ${{ runner.temp }}/exact-wheel-receipt.json
          EXACT_WHEEL_VENV: ${{ runner.temp }}/exact-wheel-venv
        shell: bash
        run: |
          set -euo pipefail
          unset DEEPLAW_REFERENCE_FREEZER DEEPLAW_REFERENCE_DOMAIN_RUNNER \
            DEEPLAW_REVIEWER_OUTPUT_1 DEEPLAW_REVIEWER_OUTPUT_2 DEEPLAW_REVIEWER_OUTPUT_3 \
            DEEPLAW_REVIEWER_PROCESS_1 DEEPLAW_REVIEWER_PROCESS_2 DEEPLAW_REVIEWER_PROCESS_3 \
            DEEPLAW_SCORER_A DEEPLAW_SCORER_B DEEPLAW_DETERMINISTIC_ARBITER
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER:-}"
          test -n "${DEEPLAW_CANDIDATE_HOST_RUNNER:-}"
          test -n "${DEEPLAW_CODEX_CREDENTIAL_BROKER:-}"
          test -n "${DEEPLAW_OPENCODE_CREDENTIAL_BROKER:-}"
          test -n "${DEEPLAW_OPENCODE_DOTENV:-}"
          test -n "${DEEPLAW_HOST_PROVIDER_ALLOWLIST:-}"
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256:-}"
          test -n "${DEEPLAW_QUALIFICATION_INPUTS:-}"
          test -n "${DEEPLAW_FINAL_BLIND_INPUTS:-}"
          test ! -e "${CANDIDATE_INPUT_ROOT}/reference"
          test ! -e "${CANDIDATE_INPUT_ROOT}/scorer-a"
          test ! -e "${CANDIDATE_INPUT_ROOT}/scorer-b"
          test ! -e "${CANDIDATE_INPUT_ROOT}/arbiter"
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          def check_path(
              name: str,
              *,
              directory: bool = False,
              executable: bool = False,
              owner_only: bool = False,
          ) -> None:
              value = os.environ.get(name)
              if not value:
                  raise SystemExit("required external input is missing")
              path = Path(value)
              if not path.is_absolute():
                  raise SystemExit("external input must be absolute")
              current = Path(path.anchor)
              for part in path.parts[1:]:
                  current /= part
                  try:
                      current_stat = current.lstat()
                  except FileNotFoundError as error:
                      raise SystemExit("external input is unavailable") from error
                  if stat.S_ISLNK(current_stat.st_mode):
                      raise SystemExit("external input contains a symlink")
              observed = path.lstat()
              if directory:
                  if not stat.S_ISDIR(observed.st_mode):
                      raise SystemExit("external input directory is invalid")
              elif not stat.S_ISREG(observed.st_mode):
                  raise SystemExit("external input file is not regular")
              if observed.st_uid != os.getuid():
                  raise SystemExit("external input owner differs")
              mode = stat.S_IMODE(observed.st_mode)
              if mode & 0o022:
                  raise SystemExit("external input is writable by a non-owner")
              if owner_only and mode & 0o077:
                  raise SystemExit("owner-only external input has broad mode")
              if executable and not mode & stat.S_IXUSR:
                  raise SystemExit("external executable is not owner-executable")
              if directory:
                  for child in path.rglob("*"):
                      child_stat = child.lstat()
                      if stat.S_ISLNK(child_stat.st_mode):
                          raise SystemExit("external input tree contains a symlink")
                      if not stat.S_ISDIR(child_stat.st_mode) and not stat.S_ISREG(child_stat.st_mode):
                          raise SystemExit("external input tree contains a special file")
                      if child_stat.st_uid != os.getuid() or stat.S_IMODE(child_stat.st_mode) & 0o022:
                          raise SystemExit("external input tree owner or mode differs")

          check_path("DEEPLAW_SECURITY_DOMAIN_ATTESTER", executable=True, owner_only=True)
          check_path("DEEPLAW_CANDIDATE_HOST_RUNNER", executable=True, owner_only=True)
          check_path("DEEPLAW_CODEX_CREDENTIAL_BROKER", executable=True, owner_only=True)
          check_path("DEEPLAW_OPENCODE_CREDENTIAL_BROKER", executable=True, owner_only=True)
          check_path("DEEPLAW_CODEX_BINARY", executable=True)
          check_path("DEEPLAW_OPENCODE_BINARY", executable=True)
          check_path("DEEPLAW_OPENCODE_PACKAGE")
          check_path("DEEPLAW_OPENCODE_DOTENV", owner_only=True)
          check_path("DEEPLAW_HOST_PROVIDER_ALLOWLIST", owner_only=True)
          check_path("DEEPLAW_QUALIFICATION_INPUTS", owner_only=True)
          check_path("DEEPLAW_FINAL_BLIND_INPUTS", owner_only=True)
          check_path("DIST_ROOT", directory=True)
          check_path("EXACT_WHEEL_RECEIPT")
          check_path("EXACT_WHEEL_VENV", directory=True)
          def sha256(path: str) -> str:
              digest = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          active_path = Path(os.environ["CANDIDATE_INPUT_ROOT"]) / (
              "verified-candidate-artifacts/frozen-active-qualification.json"
          )
          active = json.loads(active_path.read_text(encoding="utf-8"))
          external = active.get("external_inputs", {})
          host = active.get("host_constraints", {})
          expected = {
              "DEEPLAW_CANDIDATE_HOST_RUNNER": external.get("runner_sha256"),
              "DEEPLAW_QUALIFICATION_INPUTS": external.get(
                  "qualification_holdout_sha256"
              ),
              "DEEPLAW_FINAL_BLIND_INPUTS": external.get("final_blind_holdout_sha256"),
              "DEEPLAW_SECURITY_DOMAIN_ATTESTER": external.get("isolation_sha256"),
              "DEEPLAW_OPENCODE_BINARY": host.get("opencode", {}).get(
                  "executable_sha256"
              ),
              "DEEPLAW_OPENCODE_PACKAGE": host.get("opencode", {}).get("package_sha256"),
          }
          for name, expected_sha256 in expected.items():
              if sha256(os.environ[name]) != expected_sha256:
                  raise SystemExit("external input differs from frozen active qualification")
          print("Candidate external input preflight and frozen hashes verified")
          PY
          test "$("${DEEPLAW_CODEX_BINARY}" --version)" = "codex-cli 0.148.0-alpha.9"
          test "$("${DEEPLAW_OPENCODE_BINARY}" --version)" = "1.18.16"
          codex_sha256="$(shasum -a 256 "${DEEPLAW_CODEX_BINARY}" | cut -d ' ' -f 1)"
          opencode_sha256="$(shasum -a 256 "${DEEPLAW_OPENCODE_BINARY}" | cut -d ' ' -f 1)"
          opencode_package_sha256="$(shasum -a 256 "${DEEPLAW_OPENCODE_PACKAGE}" | cut -d ' ' -f 1)"
          attester_sha256="$(shasum -a 256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" | cut -d ' ' -f 1)"
          test "${codex_sha256}" = "6170ff5578170ee9b74ad92bfcff96e6186f41d02b60815a7c2b01ad424c754f"
          test "${attester_sha256}" = "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}"
          mkdir -p candidate-output/security candidate-output/codex candidate-output/opencode
          "${DEEPLAW_CODEX_CREDENTIAL_BROKER}" \
            --host-runner "${DEEPLAW_CANDIDATE_HOST_RUNNER}" \
            --codex-binary "${DEEPLAW_CODEX_BINARY}" \
            --codex-sha256 "${codex_sha256}" \
            --candidate-inputs "${DEEPLAW_QUALIFICATION_INPUTS}" \
            --verified-dist "${DIST_ROOT}" \
            --network-policy host_provider_allowlist \
            --provider-allowlist "${DEEPLAW_HOST_PROVIDER_ALLOWLIST}" \
            --request-model "gpt-5.6-luna" \
            --reasoning-effort max \
            --process-receipt candidate-output/codex/process.json \
            --output candidate-output/codex
          "${DEEPLAW_OPENCODE_CREDENTIAL_BROKER}" \
            --host-runner "${DEEPLAW_CANDIDATE_HOST_RUNNER}" \
            --opencode-binary "${DEEPLAW_OPENCODE_BINARY}" \
            --opencode-package "${DEEPLAW_OPENCODE_PACKAGE}" \
            --opencode-sha256 "${opencode_sha256}" \
            --opencode-package-sha256 "${opencode_package_sha256}" \
            --dotenv "${DEEPLAW_OPENCODE_DOTENV}" \
            --candidate-inputs "${DEEPLAW_QUALIFICATION_INPUTS}" \
            --verified-dist "${DIST_ROOT}" \
            --network-policy host_provider_allowlist \
            --provider-allowlist "${DEEPLAW_HOST_PROVIDER_ALLOWLIST}" \
            --opencode-version "1.18.16" \
            --opencode-source-commit "a3647eb025c7615159d417dcc49fc39fdaeba65b" \
            --request-model "deepseek/deepseek-v4-flash" \
            --process-receipt candidate-output/opencode/process.json \
            --output candidate-output/opencode
          test -s candidate-output/codex/process.json
          test -s candidate-output/opencode/process.json
          "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" \
            --role candidate_host \
            --runner-label deeplaw-qualification-candidate \
            --network-policy host_provider_allowlist \
            --provider-allowlist "${DEEPLAW_HOST_PROVIDER_ALLOWLIST}" \
            --process-receipt candidate-output/codex/process.json \
            --process-receipt candidate-output/opencode/process.json \
            --observed-root candidate-output \
            --attester-executable-sha256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}" \
            --output candidate-output/security/candidate_host.json
          test -s candidate-output/security/candidate_host.json
          forbidden_path="$(find candidate-output \( -name '.env' -o -name 'auth.json' -o -name 'transcript' -o -name 'reasoning' -o -name 'raw-events' \) -print -quit)"
          test -z "${forbidden_path}"

      - name: Export only sanitized candidate output for downstream scorers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-sanitized-output
          cp -R candidate-output/security candidate-sanitized-output/
          cp -R candidate-output/codex candidate-sanitized-output/
          cp -R candidate-output/opencode candidate-sanitized-output/
          cp "${EXACT_WHEEL_RECEIPT}" candidate-sanitized-output/exact-wheel-receipt.json
          cp "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts/retained-artifact-manifest.json" candidate-sanitized-output/
          cp "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts/frozen-active-qualification.json" candidate-sanitized-output/
          cp "${CANDIDATE_INPUT_ROOT}/candidate-full-raw-evidence/candidate-full-inventory-receipt.json" candidate-sanitized-output/
          forbidden_path="$(find candidate-sanitized-output \( -name '.env' -o -name 'auth.json' -o -name 'transcript' -o -name 'reasoning' -o -name 'raw-events' \) -print -quit)"
          test -z "${forbidden_path}"

      - name: Upload one-way sanitized candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-sanitized-output
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: candidate-sanitized-output/

      - name: Export exact Candidate Full inputs for assembly only
        env:
          DIST_ROOT: ${{ runner.temp }}/candidate-dist
          EXACT_WHEEL_RECEIPT: ${{ runner.temp }}/exact-wheel-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-qualification-inputs/verified-dist candidate-qualification-inputs/candidate-full-raw-evidence
          cp "${CANDIDATE_INPUT_ROOT}/verified-candidate-artifacts/"* candidate-qualification-inputs/verified-dist/
          cp "${CANDIDATE_INPUT_ROOT}/candidate-full-raw-evidence/"* candidate-qualification-inputs/candidate-full-raw-evidence/
          cp "${EXACT_WHEEL_RECEIPT}" candidate-qualification-inputs/exact-wheel-receipt.json
          test -s candidate-qualification-inputs/verified-dist/retained-artifact-manifest.json
          test -s candidate-qualification-inputs/candidate-full-raw-evidence/candidate-full-inventory-receipt.json
          test -s candidate-qualification-inputs/exact-wheel-receipt.json
          forbidden_path="$(find candidate-qualification-inputs \( -name '.env' -o -name 'auth.json' -o -name 'transcript' -o -name 'reasoning' -o -name 'raw-events' \) -print -quit)"
          test -z "${forbidden_path}"

      - name: Upload exact Candidate Full inputs for assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-qualification-inputs
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: candidate-qualification-inputs/

  reference_freezer:
    name: Reference freezer domain (sealed before candidate visibility)
    runs-on: [self-hosted, macOS, deeplaw-qualification-reference]
    timeout-minutes: 120
    steps:
      - name: Freeze sealed reference in the reference-only domain
        shell: bash
        run: |
          set -euo pipefail
          unset DEEPLAW_CANDIDATE_HOST_RUNNER DEEPLAW_CODEX_BINARY \
            DEEPLAW_OPENCODE_BINARY DEEPLAW_OPENCODE_PACKAGE DEEPLAW_OPENCODE_DOTENV \
            DEEPLAW_CODEX_CREDENTIAL_BROKER DEEPLAW_OPENCODE_CREDENTIAL_BROKER \
            DEEPLAW_SCORER_A DEEPLAW_SCORER_B DEEPLAW_DETERMINISTIC_ARBITER
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER:-}"
          test -n "${DEEPLAW_REFERENCE_FREEZER:-}"
          test -n "${DEEPLAW_REFERENCE_CASES:-}"
          test -n "${DEEPLAW_REVIEWER_OUTPUT_1:-}"
          test -n "${DEEPLAW_REVIEWER_OUTPUT_2:-}"
          test -n "${DEEPLAW_REVIEWER_OUTPUT_3:-}"
          test -n "${DEEPLAW_REVIEWER_PROCESS_1:-}"
          test -n "${DEEPLAW_REVIEWER_PROCESS_2:-}"
          test -n "${DEEPLAW_REVIEWER_PROCESS_3:-}"
          test -n "${DEEPLAW_REFERENCE_DOMAIN_RUNNER:-}"
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256:-}"
          test ! -e "${RUNNER_TEMP}/candidate-sanitized-output"
          test -f "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test ! -L "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          python - <<'PY'
          import os
          import stat
          from pathlib import Path

          executables = {
              "DEEPLAW_SECURITY_DOMAIN_ATTESTER",
              "DEEPLAW_REFERENCE_FREEZER",
              "DEEPLAW_REFERENCE_DOMAIN_RUNNER",
          }
          files = executables | {
              "DEEPLAW_REFERENCE_CASES",
              "DEEPLAW_REVIEWER_OUTPUT_1",
              "DEEPLAW_REVIEWER_OUTPUT_2",
              "DEEPLAW_REVIEWER_OUTPUT_3",
              "DEEPLAW_REVIEWER_PROCESS_1",
              "DEEPLAW_REVIEWER_PROCESS_2",
              "DEEPLAW_REVIEWER_PROCESS_3",
          }
          for name in files:
              path = Path(os.environ[name])
              if not path.is_absolute() or path.is_symlink() or not path.is_file():
                  raise SystemExit("reference external input is not a regular absolute file")
              observed = path.stat()
              mode = stat.S_IMODE(observed.st_mode)
              if observed.st_uid != os.getuid() or mode & 0o077:
                  raise SystemExit("reference external input is not owner-only")
              if name in executables and not mode & stat.S_IXUSR:
                  raise SystemExit("reference external executable is not owner-executable")
          PY
          attester_sha256="$(shasum -a 256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" | cut -d ' ' -f 1)"
          test "${attester_sha256}" = "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}"
          mkdir -p sealed-reference/security sealed-reference/payload
          "${DEEPLAW_REFERENCE_DOMAIN_RUNNER}" \
            --freezer "${DEEPLAW_REFERENCE_FREEZER}" \
            --reference-cases "${DEEPLAW_REFERENCE_CASES}" \
            --reviewer-output "${DEEPLAW_REVIEWER_OUTPUT_1}" \
            --reviewer-output "${DEEPLAW_REVIEWER_OUTPUT_2}" \
            --reviewer-output "${DEEPLAW_REVIEWER_OUTPUT_3}" \
            --reviewer-process "${DEEPLAW_REVIEWER_PROCESS_1}" \
            --reviewer-process "${DEEPLAW_REVIEWER_PROCESS_2}" \
            --reviewer-process "${DEEPLAW_REVIEWER_PROCESS_3}" \
            --candidate-visible false \
            --process-receipt sealed-reference/process.json \
            --output sealed-reference/payload
          test -s sealed-reference/process.json
          "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" \
            --role reference_freezer \
            --runner-label deeplaw-qualification-reference \
            --network-policy deny_all \
            --process-receipt sealed-reference/process.json \
            --observed-root sealed-reference/payload \
            --attester-executable-sha256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}" \
            --output sealed-reference/security/reference_freezer.json
          for required in semantic.json roster.json consensus.json isolation.json reference_freezer.json; do
            test -s "$(find sealed-reference -name "${required}" -print -quit)"
          done
          test ! -e sealed-reference/.env
          test ! -e sealed-reference/auth.json

      - name: Upload one-way sealed reference artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-reference
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: sealed-reference/

  scorer_a:
    name: Scorer A domain (candidate plus sealed reference only)
    needs: [candidate, reference_freezer]
    runs-on: [self-hosted, macOS, deeplaw-qualification-scorer-a]
    timeout-minutes: 180
    steps:
      - name: Download only candidate output and sealed reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-sanitized-output
          path: scorer-inputs/candidate-sanitized-output
      - name: Download only sealed reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-reference
          path: scorer-inputs/sealed-reference
      - name: Score with an OS-observed isolated domain
        shell: bash
        run: |
          set -euo pipefail
          unset DEEPLAW_OPENCODE_DOTENV DEEPLAW_CODEX_CREDENTIAL_BROKER \
            DEEPLAW_OPENCODE_CREDENTIAL_BROKER DEEPLAW_CODEX_BINARY \
            DEEPLAW_OPENCODE_BINARY DEEPLAW_OPENCODE_PACKAGE \
            DEEPLAW_CANDIDATE_HOST_RUNNER DEEPLAW_DETERMINISTIC_ARBITER
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER:-}"
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256:-}"
          test -n "${DEEPLAW_SCORER_A:-}"
          test ! -e scorer-inputs/scorer-b-output
          test ! -e scorer-inputs/arbiter-output
          test ! -e scorer-inputs/.env
          test -f "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test ! -L "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test -f "${DEEPLAW_SCORER_A}"
          test ! -L "${DEEPLAW_SCORER_A}"
          test "$(stat -f '%u:%Lp' "${DEEPLAW_SCORER_A}")" = "$(id -u):700"
          attester_sha256="$(shasum -a 256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" | cut -d ' ' -f 1)"
          test "${attester_sha256}" = "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}"
          expected_scorer_sha256="$(python -c 'import json,pathlib; print(json.loads(pathlib.Path("scorer-inputs/candidate-sanitized-output/frozen-active-qualification.json").read_text(encoding="utf-8"))["external_inputs"]["scorer_a_sha256"])')"
          test "$(shasum -a 256 "${DEEPLAW_SCORER_A}" | cut -d ' ' -f 1)" = "${expected_scorer_sha256}"
          mkdir -p scorer-a-output/security scorer-a-output/result
          "${DEEPLAW_SCORER_A}" \
            --candidate-output-root scorer-inputs/candidate-sanitized-output \
            --sealed-reference-root scorer-inputs/sealed-reference \
            --process-receipt scorer-a-output/result/process.json \
            --output scorer-a-output/result
          test -s scorer-a-output/result/process.json
          cp scorer-inputs/candidate-sanitized-output/frozen-active-qualification.json \
            scorer-a-output/result/frozen-active-qualification.json
          test -s scorer-a-output/result/frozen-active-qualification.json
          "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" \
            --role scorer_a \
            --runner-label deeplaw-qualification-scorer-a \
            --network-policy deny_all \
            --process-receipt scorer-a-output/result/process.json \
            --observed-root scorer-a-output/result \
            --attester-executable-sha256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}" \
            --output scorer-a-output/security/scorer_a.json
          test -s scorer-a-output/security/scorer_a.json
          test ! -e scorer-a-output/.env
          test ! -e scorer-a-output/auth.json

      - name: Upload scorer A output only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorer-a-output
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: scorer-a-output/

  scorer_b:
    name: Scorer B domain (candidate plus sealed reference only)
    needs: [candidate, reference_freezer]
    runs-on: [self-hosted, macOS, deeplaw-qualification-scorer-b]
    timeout-minutes: 180
    steps:
      - name: Download only candidate output and sealed reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-sanitized-output
          path: scorer-inputs/candidate-sanitized-output
      - name: Download only sealed reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
