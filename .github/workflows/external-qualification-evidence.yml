      - name: Upload scorer B output only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorer-b-output
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: scorer-b-output/

  arbiter:
    name: Arbiter domain (two scorer outputs only)
    needs: [scorer_a, scorer_b]
    runs-on: [self-hosted, macOS, deeplaw-qualification-arbiter]
    timeout-minutes: 120
    steps:
      - name: Download scorer A output only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorer-a-output
          path: arbiter-inputs/scorer-a-output
      - name: Download scorer B output only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorer-b-output
          path: arbiter-inputs/scorer-b-output
      - name: Arbitrate without candidate, reference, or credentials
        shell: bash
        run: |
          set -euo pipefail
          unset DEEPLAW_OPENCODE_DOTENV DEEPLAW_CODEX_CREDENTIAL_BROKER \
            DEEPLAW_OPENCODE_CREDENTIAL_BROKER DEEPLAW_CODEX_BINARY \
            DEEPLAW_OPENCODE_BINARY DEEPLAW_OPENCODE_PACKAGE \
            DEEPLAW_CANDIDATE_HOST_RUNNER DEEPLAW_SCORER_A DEEPLAW_SCORER_B
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER:-}"
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256:-}"
          test -n "${DEEPLAW_DETERMINISTIC_ARBITER:-}"
          test ! -e arbiter-inputs/candidate-sanitized-output
          test ! -e arbiter-inputs/sealed-reference
          test ! -e arbiter-inputs/.env
          test -f "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test ! -L "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test -f "${DEEPLAW_DETERMINISTIC_ARBITER}"
          test ! -L "${DEEPLAW_DETERMINISTIC_ARBITER}"
          test "$(stat -f '%u:%Lp' "${DEEPLAW_DETERMINISTIC_ARBITER}")" = "$(id -u):700"
          test -s arbiter-inputs/scorer-a-output/result/frozen-active-qualification.json
          test -s arbiter-inputs/scorer-b-output/result/frozen-active-qualification.json
          cmp -s \
            arbiter-inputs/scorer-a-output/result/frozen-active-qualification.json \
            arbiter-inputs/scorer-b-output/result/frozen-active-qualification.json
          expected_arbiter_sha256="$(python -c 'import json,pathlib; print(json.loads(pathlib.Path("arbiter-inputs/scorer-a-output/result/frozen-active-qualification.json").read_text(encoding="utf-8"))["external_inputs"]["arbitration_sha256"])')"
          test "$(shasum -a 256 "${DEEPLAW_DETERMINISTIC_ARBITER}" | cut -d ' ' -f 1)" = "${expected_arbiter_sha256}"
          attester_sha256="$(shasum -a 256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" | cut -d ' ' -f 1)"
          test "${attester_sha256}" = "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}"
          mkdir -p arbiter-output/security arbiter-output/result
          "${DEEPLAW_DETERMINISTIC_ARBITER}" \
            --scorer-a-root arbiter-inputs/scorer-a-output \
            --scorer-b-root arbiter-inputs/scorer-b-output \
            --process-receipt arbiter-output/result/process.json \
            --output arbiter-output/result
          test -s arbiter-output/result/process.json
          "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" \
            --role arbiter \
            --runner-label deeplaw-qualification-arbiter \
            --network-policy deny_all \
            --process-receipt arbiter-output/result/process.json \
            --observed-root arbiter-output/result \
            --attester-executable-sha256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}" \
            --output arbiter-output/security/arbiter.json
          test -s arbiter-output/security/arbiter.json
          test ! -e arbiter-output/.env

      - name: Upload arbiter output only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arbiter-output
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: arbiter-output/

  assembly:
    name: Sanitized assembly domain (no credential broker)
    needs: [candidate, reference_freezer, scorer_a, scorer_b, arbiter]
    runs-on: [self-hosted, macOS, deeplaw-qualification-assembly]
    timeout-minutes: 180
    steps:
      - name: Check out the exact verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install the checkout verifier runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download candidate output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-sanitized-output
          path: assembly-inputs/candidate-sanitized-output
      - name: Download exact Candidate Full inputs for assembly
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-qualification-inputs
          path: assembly-inputs/candidate-qualification-inputs
      - name: Download sealed reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-reference
          path: assembly-inputs/sealed-reference
      - name: Download scorer A output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorer-a-output
          path: assembly-inputs/scorer-a-output
      - name: Download scorer B output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorer-b-output
          path: assembly-inputs/scorer-b-output
      - name: Download arbiter output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arbiter-output
          path: assembly-inputs/arbiter-output
      - name: Assemble and reopen the sanitized machine-only v4 bundle
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          unset DEEPLAW_OPENCODE_DOTENV DEEPLAW_CODEX_CREDENTIAL_BROKER \
            DEEPLAW_OPENCODE_CREDENTIAL_BROKER DEEPLAW_CODEX_BINARY \
            DEEPLAW_OPENCODE_BINARY DEEPLAW_OPENCODE_PACKAGE \
            DEEPLAW_CANDIDATE_HOST_RUNNER DEEPLAW_SCORER_A DEEPLAW_SCORER_B \
            DEEPLAW_DETERMINISTIC_ARBITER DEEPLAW_SECURITY_DOMAIN_ATTESTER \
            DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256
          test -n "${DEEPLAW_EVIDENCE_ASSEMBLER:-}"
          test ! -e assembly-inputs/.env
          test ! -e assembly-inputs/auth.json
          test ! -e assembly-inputs/transcript
          test ! -e assembly-inputs/reasoning
          test ! -e assembly-inputs/raw-events
          test ! -e assembly-inputs/candidate-inputs
          verified_dist=assembly-inputs/candidate-qualification-inputs/verified-dist
          candidate_full_raw_root=assembly-inputs/candidate-qualification-inputs/candidate-full-raw-evidence
          exact_wheel_receipt=assembly-inputs/candidate-qualification-inputs/exact-wheel-receipt.json
          test -d "${verified_dist}"
          test -d "${candidate_full_raw_root}"
          test -s "${verified_dist}/retained-artifact-manifest.json"
          test -s "${verified_dist}/frozen-active-qualification.json"
          test -s "${candidate_full_raw_root}/candidate-full-run-receipt.json"
          test -s "${candidate_full_raw_root}/candidate-full-inventory-receipt.json"
          test -s "${exact_wheel_receipt}"
          forbidden_path="$(find assembly-inputs/candidate-qualification-inputs \( -name '.env' -o -name 'auth.json' -o -name 'transcript' -o -name 'reasoning' -o -name 'raw-events' \) -print -quit)"
          test -z "${forbidden_path}"
          python - "${verified_dist}" "${exact_wheel_receipt}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          dist = Path(sys.argv[1])
          receipt = Path(sys.argv[2])
          manifest = json.loads((dist / "retained-artifact-manifest.json").read_text(encoding="utf-8"))
          for key in ("wheel", "sdist"):
              row = manifest.get(key)
              if not isinstance(row, dict) or set(row) != {"filename", "sha256", "bytes"}:
                  raise SystemExit("Candidate Full artifact manifest is not closed")
              artifact = dist / row["filename"]
              data = artifact.read_bytes()
              if hashlib.sha256(data).hexdigest() != row["sha256"] or len(data) != row["bytes"]:
                  raise SystemExit("Candidate Full artifact bytes differ from manifest")
          receipt_value = json.loads(receipt.read_text(encoding="utf-8"))
          if not isinstance(receipt_value, dict) or not receipt_value:
              raise SystemExit("exact-wheel receipt is not retained")
          print("Exact Candidate Full inputs verified for assembly")
          PY
          bundle=assembly-output/bundle
          active="${verified_dist}/frozen-active-qualification.json"
          "${DEEPLAW_EVIDENCE_ASSEMBLER}" \
            --candidate-output-root assembly-inputs/candidate-sanitized-output \
            --candidate-full-raw-root "${candidate_full_raw_root}" \
            --verified-dist "${verified_dist}" \
            --exact-wheel-receipt "${exact_wheel_receipt}" \
            --active-qualification "${active}" \
            --reference-root assembly-inputs/sealed-reference \
            --scorer-a-root assembly-inputs/scorer-a-output \
            --scorer-b-root assembly-inputs/scorer-b-output \
            --arbitration-root assembly-inputs/arbiter-output \
            --security-domain-root assembly-inputs \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --evidence-run-id "${EVIDENCE_RUN_ID}" \
            --output assembly-output/bundle
          test -s "${bundle}/bundle-manifest.json"
          test ! -e "${bundle}/.env"
          test ! -e "${bundle}/auth.json"
          test ! -e "${bundle}/transcript"
          test ! -e "${bundle}/reasoning"
          test ! -e "${bundle}/raw-events"
          uv run --frozen python -m benchmarks.release.external_qualification_bundle_v4 \
            --root "${bundle}" \
            --active-qualification "${active}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --evidence-run-id "${EVIDENCE_RUN_ID}" \
            > assembly-output/bundle-validation.json
          test -s assembly-output/bundle-validation.json
          reject_literal() {
            if grep -Fq -- "$1" "$2"; then
              return 1
            else
              grep_status=$?
              test "${grep_status}" -eq 1
            fi
          }
          reject_literal "${GITHUB_WORKSPACE}" assembly-output/bundle-validation.json
          reject_literal "${RUNNER_TEMP}" assembly-output/bundle-validation.json

      - name: Upload sanitized external qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v013-qualification-evidence
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          path: assembly-output/bundle/
