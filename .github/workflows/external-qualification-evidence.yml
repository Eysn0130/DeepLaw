          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER:-}"
          test -n "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256:-}"
          test -n "${DEEPLAW_SCORER_B:-}"
          test ! -e scorer-inputs/scorer-a-output
          test ! -e scorer-inputs/arbiter-output
          test ! -e scorer-inputs/.env
          test -f "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test ! -L "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}"
          test -f "${DEEPLAW_SCORER_B}"
          test ! -L "${DEEPLAW_SCORER_B}"
          test "$(stat -f '%u:%Lp' "${DEEPLAW_SCORER_B}")" = "$(id -u):700"
          attester_sha256="$(shasum -a 256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER}" | cut -d ' ' -f 1)"
          test "${attester_sha256}" = "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}"
          expected_scorer_sha256="$(python -c 'import json,pathlib; print(json.loads(pathlib.Path("scorer-inputs/candidate-sanitized-output/frozen-active-qualification.json").read_text(encoding="utf-8"))["external_inputs"]["scorer_b_sha256"])')"
          test "$(shasum -a 256 "${DEEPLAW_SCORER_B}" | cut -d ' ' -f 1)" = "${expected_scorer_sha256}"
          mkdir -p scorer-b-output/security scorer-b-output/result
          "${DEEPLAW_SCORER_B}" \
