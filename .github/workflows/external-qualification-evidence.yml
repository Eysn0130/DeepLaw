            --attester-executable-sha256 "${DEEPLAW_SECURITY_DOMAIN_ATTESTER_SHA256}" \
            --output scorer-b-output/security/scorer_b.json
          test -s scorer-b-output/security/scorer_b.json
          test ! -e scorer-b-output/.env
