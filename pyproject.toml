[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "deeplaw"
version = "0.13.0"
description = "A local-first Agent Knowledge OS that compiles source materials into a governed Living Wiki and returns verifiable, bounded knowledge context to any Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Eysn0130" }]
keywords = [
  "agent-knowledge-os",
  "agent-memory",
  "context-engineering",
  "knowledge-assets",
  "living-wiki",
  "markdown",
  "graphrag",
  "law",
  "mcp",
  "legal-research",
  "source-to-knowledge",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=50,<51",
  "defusedxml==0.7.1",
  "jsonschema>=4.26,<5",
  "mcp>=1.28.1,<2",
  "pydantic>=2.13,<3",
  "pypdf>=6.15,<7",
  "pyyaml>=6.0,<7",
  "sqlglot==30.13.0",
  "starlette>=1.3.1,<2",
  "tree-sitter==0.26.0",
  "tree-sitter-go==0.25.0",
  "tree-sitter-java==0.23.5",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
discovery = [
  "fsspec==2026.4.0; sys_platform != 'win32'",
  "fsspec==2026.6.0; sys_platform == 'win32'",
  "huggingface-hub==0.36.2",
  "numpy==2.2.6; sys_platform != 'win32' or python_version < '3.12'",
  "numpy==2.5.1; sys_platform == 'win32' and python_version >= '3.12'",
  "onnxruntime==1.27.0",
  "tokenizers==0.22.2",
]
document-engine = [
  "mineru[pipeline]==3.4.4",
  # Security floors for transitive pipeline dependencies. These exact major
  # lines completed the 28-document release build on the supported macOS host.
  "fsspec==2026.4.0; sys_platform != 'win32'",
  "fsspec==2026.6.0; sys_platform == 'win32'",
  "pillow==12.3.0",
  "setuptools>=83.0.0",
  "torch>=2.13.0,<3",
  "torchvision>=0.28.0",
  "transformers==4.57.6",
  # MinerU 3.4's pipeline imports six at runtime without declaring it.
  "six==1.17.0",
]
dev = [
  "hatchling==1.31.0",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
deeplaw = "deeplaw.cli:main"
deeplaw-document-engine = "deeplaw.document_engine_cli:main"

[project.urls]
Repository = "https://github.com/Eysn0130/DeepLaw"

[tool.hatch.build.targets.wheel]
packages = ["src/deeplaw"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "deeplaw/contracts"
"catalogs" = "deeplaw/catalogs"
"governance" = "deeplaw/governance"
"trust" = "deeplaw/trust"
"security/openvex.json" = "deeplaw/security/openvex.json"
".agents/plugins/marketplace.json" = "deeplaw/codex_marketplace/.agents/plugins/marketplace.json"
"plugins/deeplaw" = "deeplaw/codex_marketplace/plugins/deeplaw"
"plugins/deeplaw-knowledge-os" = "deeplaw/codex_marketplace/plugins/deeplaw-knowledge-os"
"adapters/opencode" = "deeplaw/opencode_adapter"

[tool.hatch.build.targets.sdist]
exclude = [
  "/benchmarks/knowledge-os-control-plane-candidate-2026-07-27.json",
  # Package-external delivery evidence may record the sdist digest without
  # creating a self-referential archive.
  "/docs/V0_7_DELIVERY_REPORT.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "qualification: reserved machine qualification cases; not part of the Platform Core Gate",
  "windows_native: exercises native Windows ACL and reparse-point behavior",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "；", "（", "）", "：", "〇"]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
